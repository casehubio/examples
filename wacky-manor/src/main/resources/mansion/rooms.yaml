rooms:
  entrance-hall:
    name: "Entrance Hall"
    description: "A grand but dusty foyer with a sweeping staircase. A chandelier hangs precariously. Portraits of stern ancestors line the walls."
    adjacentRooms: [kitchen, library]
    objects:
      coat-rack:
        name: "Coat Rack"
        description: "A wobbly wooden coat rack by the door."
        x: 0.2
      guest-book:
        name: "Guest Book"
        description: "A leather-bound guest book on a side table."
        x: 0.5

  kitchen:
    name: "Kitchen"
    description: "A large Victorian kitchen with copper pots, a wood-burning stove, and a long preparation table."
    adjacentRooms: [entrance-hall, ballroom]
    objects:
      cabinet:
        name: "Locked Cabinet"
        description: "A sturdy cabinet with a brass lock."
        x: 0.3
        interactable: true
        interactionRequires: brass-key
        yields: old-recipe-cards
      poison:
        name: "Rat Poison"
        description: "A dusty bottle of rat poison on a high shelf."
        x: 0.7
        visibleTo: [hooded-claw]
        portable: true
        itemId: rat-poison
      stove:
        name: "Wood-Burning Stove"
        description: "A cast-iron stove, still warm."
        x: 0.5

  ballroom:
    name: "Ballroom"
    description: "A grand ballroom with a cracked marble floor and dusty curtains. A long dining table is set for tea."
    adjacentRooms: [kitchen]
    objects:
      tea-service:
        name: "Tea Service"
        description: "A silver tea set with cups for everyone."
        x: 0.5
        interactable: true
        usableWith: [rat-poison]

  library:
    name: "Library"
    description: "A tall-ceilinged library with floor-to-ceiling bookshelves, a carved stone mantelpiece with an inscription, and leather reading chairs covered in dust."
    adjacentRooms: [entrance-hall, laboratory]
    objects:
      mantelpiece:
        name: "Stone Mantelpiece"
        description: "A carved stone mantelpiece with an inscription: 'I have cities but no houses, forests but no trees, water but no fish. What am I?'"
        x: 0.5
        interactable: true
      bookshelves:
        name: "Bookshelves"
        description: "Floor-to-ceiling bookshelves crammed with dusty leather-bound volumes. Several are upside down."
        x: 0.2
      reading-chairs:
        name: "Reading Chairs"
        description: "Two enormous leather armchairs facing the mantelpiece."
        x: 0.8

  laboratory:
    name: "Laboratory"
    description: "A cluttered Victorian laboratory with brass instruments, bubbling flasks, and a large machine with many levers and dials. A wire on the machine has been gnawed through."
    adjacentRooms: [library, cellar]
    objects:
      machine:
        name: "Large Machine"
        description: "A complex brass-and-copper machine with levers, dials, and a gauge. One wire has been gnawed clean through. A sign reads: 'Requires 3 operators.'"
        x: 0.5
        interactable: true
      workbench:
        name: "Workbench"
        description: "A sturdy workbench covered in tools — but no wrench."
        x: 0.2
      crates:
        name: "Wooden Crates"
        description: "A stack of old wooden crates in the corner."
        x: 0.8

  cellar:
    name: "Cellar"
    description: "A damp stone cellar with cobwebs, old furniture, and surprisingly cheerful decorations — someone has been redecorating. Air vents line the upper walls."
    adjacentRooms: [laboratory]
    objects:
      air-vents:
        name: "Air Vents"
        description: "A network of air vents along the upper walls. They look just big enough for something very small to explore."
        x: 0.3
      old-furniture:
        name: "Old Furniture"
        description: "Assorted Victorian furniture in various states of repair. Some pieces have been rearranged with surprising care."
        x: 0.6
