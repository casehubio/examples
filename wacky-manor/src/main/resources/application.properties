# Eidos persistence (in-memory stores active via casehub-eidos-memory)
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:manor;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.database.generation=drop-and-create

# Qhorus persistence (in-memory stores via casehub-qhorus-persistence-memory)
# Named datasource satisfies JPA persistence unit — Flyway disabled (PostgreSQL-only migrations)
quarkus.datasource.qhorus.db-kind=h2
quarkus.datasource.qhorus.jdbc.url=jdbc:h2:mem:qhorus;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.qhorus.database.generation=drop-and-create
quarkus.flyway.qhorus.migrate-at-start=false

# Exclude JPA stores that conflict with in-memory alternatives
quarkus.arc.exclude-types=io.casehub.eidos.runtime.health.jpa.JpaAgentStateStore,io.casehub.eidos.runtime.health.jpa.JpaCapabilitySpecializationStore,io.casehub.eidos.runtime.jpa.JpaAgentRegistry,io.casehub.eidos.runtime.health.jpa.JpaBehavioralSignalStore,io.casehub.eidos.runtime.registry.jpa.JpaAgentRegistry

# Platform identity
casehub.platform.tenancy-id=wacky-manor
