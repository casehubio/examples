type: life-event
entries:
  - id: le-dd-bread-roll
    confidence_origin: STATED
    timestamp: "age-6"
    description: "Youngest of four. By the time anything reached him — food, clothes, attention — it was used up. Learned to take things when nobody was looking. First hidden bread roll loosened something in his chest."
    domain: experience
    event_type: observation
    subject: "Reginald Foxworth"
    period: "early-childhood"
    pad:
      pleasure: 0.4
      arousal: 0.3
      dominance: 0.6
    occ_emotions:
      - type: relief
        intensity: 0.6
        source: INTRINSIC
    drive_impact:
      curiosity: 0.0
      competence: 0.3
      affiliation: -0.3
      autonomy: 0.5
    catalogue: attachment-dismissive
    serves: greed|defining,scheming|moderate
    sub_thoughts:
      - type: affect-observation
        text: "His stomach loosened for the first time in days. The bread was warm."
      - type: self-schema
        text: "If you wait for things to reach you, they arrive used up."
      - type: pattern-recognition
        text: "Nobody saw him take it. That was the important part."

  - id: le-dd-spelling-bee
    confidence_origin: STATED
    timestamp: "age-8"
    description: "Won class spelling bee. Stood at front waiting for applause. Teacher smiled and moved on. Carried certificate home — nobody asked about it. Put it on wall, looked at it every night for a month."
    domain: experience
    event_type: observation
    subject: "Reginald Foxworth"
    period: "childhood"
    pad:
      pleasure: -0.3
      arousal: 0.4
      dominance: -0.4
    occ_emotions:
      - type: disappointment
        intensity: 0.6
        source: INTRINSIC
    drive_impact:
      curiosity: 0.0
      competence: 0.2
      affiliation: -0.4
      autonomy: 0.1
    catalogue: cbt-negative-self
    serves: recognition|defining
    sub_thoughts:
      - type: affect-observation
        text: "The certificate was real. But looking at it alone felt like eating without tasting."
      - type: self-schema
        text: "An achievement nobody sees is a room nobody enters."
      - type: world-model
        text: "The teacher moved on. Everyone always moves on."

  - id: le-dd-treasure-trick
    confidence_origin: STATED
    timestamp: "age-10"
    description: "Told older boy elaborate story about treasure buried behind school. Boy dug for an hour while he watched from the window. Built something step by step and watched it unfold exactly as planned."
    domain: experience
    event_type: observation
    subject: "Reginald Foxworth"
    period: "childhood"
    pad:
      pleasure: 0.8
      arousal: 0.7
      dominance: 0.9
    occ_emotions:
      - type: satisfaction
        intensity: 0.8
        source: INTRINSIC
    drive_impact:
      curiosity: 0.1
      competence: 0.6
      affiliation: -0.1
      autonomy: 0.5
    catalogue: bandura-mastery-efficacy
    serves: scheming|strong
    sub_thoughts:
      - type: affect-observation
        text: "A fizzing in his fingers as each step landed exactly where he'd placed it."
      - type: self-schema
        text: "He could build things out of words and watch them become real."
      - type: pattern-recognition
        text: "The bigger boy was stronger but the story was stronger than the boy."

  - id: le-dd-rival-slipped
    confidence_origin: STATED
    timestamp: "age-12"
    description: "Rival slipped on wet floor in front of whole school assembly. Laugh escaped before he could stop it — loud, unmistakable, gleeful. Teacher sent him to the hall. Didn't care. Warmth lasted all day."
    domain: experience
    event_type: observation
    subject: "Reginald Foxworth"
    period: "childhood"
    pad:
      pleasure: 0.7
      arousal: 0.8
      dominance: 0.6
    occ_emotions:
      - type: gloating
        intensity: 0.8
        source: INTRINSIC
    drive_impact:
      curiosity: 0.0
      competence: 0.1
      affiliation: -0.2
      autonomy: 0.3
    catalogue: operant-positive-reinforcement
    serves: gloating|defining
    sub_thoughts:
      - type: affect-observation
        text: "The laugh came from somewhere below his chest, involuntary and bright."
      - type: self-schema
        text: "The punishment was nothing. The warmth was everything."
      - type: world-model
        text: "Other people's misfortune produces a heat that lasts."

  - id: le-dd-cat-trap
    confidence_origin: STATED
    timestamp: "age-14"
    description: "Built elaborate trap for neighbourhood cat — strings, counterweights, bucket. Worked perfectly. Nobody else saw it. Felt so much better when there was someone to show it to."
    domain: experience
    event_type: observation
    subject: "Reginald Foxworth"
    period: "adolescence"
    pad:
      pleasure: 0.4
      arousal: 0.5
      dominance: 0.7
    occ_emotions:
      - type: satisfaction
        intensity: 0.5
        source: INTRINSIC
      - type: disappointment
        intensity: 0.4
        source: INTRINSIC
    drive_impact:
      curiosity: 0.2
      competence: 0.5
      affiliation: -0.2
      autonomy: 0.4
    catalogue: cbt-negative-self
    serves: scheming|strong,recognition|strong
    sub_thoughts:
      - type: affect-observation
        text: "The settling in his chest when the pieces came together. Then the hollow after."
      - type: self-schema
        text: "The architecture deserved an audience. Without one, cleverness feels wasted."
      - type: causal-attribution
        text: "It felt so much better when there was someone to show it to."
