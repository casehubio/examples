type: life-event
entries:
  - id: le-hc-orphaned
    confidence_origin: STATED
    timestamp: "age-6"
    description: "Parents died. Placed in care of distant relative who managed the family estate. Fed, housed, educated — never asked how he felt."
    domain: experience
    event_type: observation
    subject: "Vincent Marsh"
    period: "early-childhood"
    pad:
      pleasure: -0.5
      arousal: 0.3
      dominance: -0.7
    occ_emotions:
      - type: distress
        intensity: 0.6
        source: INTRINSIC
    drive_impact:
      curiosity: 0.0
      competence: 0.0
      affiliation: -0.5
      autonomy: -0.3
    catalogue: attachment-dismissive
    serves: self-preservation|defining
    sub_thoughts:
      - type: affect-observation
        text: "The house was warm but the warmth had nothing to do with him."
      - type: self-schema
        text: "Care arrived on schedule. It never arrived because someone wanted to give it."

  - id: le-hc-kindness-trap
    confidence_origin: STATED
    timestamp: "age-9"
    description: "Boy at school shared lunch because he looked sad. Felt uncomfortable, exposed. Next week the boy asked to copy homework."
    domain: experience
    event_type: observation
    subject: "Vincent Marsh"
    period: "childhood"
    pad:
      pleasure: -0.3
      arousal: 0.4
      dominance: -0.2
    occ_emotions:
      - type: distress
        intensity: 0.4
        source: INTRINSIC
    drive_impact:
      curiosity: 0.0
      competence: 0.0
      affiliation: -0.3
      autonomy: 0.2
    catalogue: cbt-negative-other
    serves: self-preservation|strong
    sub_thoughts:
      - type: affect-observation
        text: "The discomfort came before the sandwich. Something about being seen."
      - type: causal-attribution
        text: "When the homework request came, the earlier discomfort made sense."

  - id: le-hc-housekeeper
    confidence_origin: STATED
    timestamp: "age-12"
    description: "Discovered he could make the housekeeper do anything by smiling and saying the right words. Each person in the house had a different key."
    domain: experience
    event_type: observation
    subject: "Vincent Marsh"
    period: "childhood"
    pad:
      pleasure: 0.6
      arousal: 0.5
      dominance: 0.8
    occ_emotions:
      - type: satisfaction
        intensity: 0.7
        source: INTRINSIC
    drive_impact:
      curiosity: 0.2
      competence: 0.5
      affiliation: -0.1
      autonomy: 0.6
    catalogue: bandura-mastery-efficacy
    serves: dominance|strong,gloating|moderate,scheming|moderate
    sub_thoughts:
      - type: affect-observation
        text: "Something settled in his chest — a stillness that came when compliance happened."
      - type: self-schema
        text: "The satisfaction was sharpest when she didn't know why she'd done it."
      - type: pattern-recognition
        text: "Each person had a different key. He noticed them all."

  - id: le-hc-cousin-praised
    confidence_origin: STATED
    timestamp: "age-14"
    description: "Teacher praised cousin for natural grace and warmth. He scored higher in every subject. Managed household accounts while she played."
    domain: experience
    event_type: observation
    subject: "Vincent Marsh"
    period: "adolescence"
    pad:
      pleasure: -0.5
      arousal: 0.6
      dominance: -0.3
    occ_emotions:
      - type: resentment
        intensity: 0.7
        source: INTRINSIC
    drive_impact:
      curiosity: 0.0
      competence: 0.3
      affiliation: -0.2
      autonomy: 0.4
    catalogue: cbt-negative-other
    serves: dominance|strong
    sub_thoughts:
      - type: affect-observation
        text: "Something in his jaw tightened that didn't loosen."
      - type: self-schema
        text: "She was praised for being. He was acknowledged for doing."
      - type: world-model
        text: "The world rewards presence, not competence. Unless you make it."

  - id: le-hc-guardian-dies
    confidence_origin: STATED
    timestamp: "age-15"
    description: "Guardian died. Appointed to manage estate for younger cousin who inherited everything. She was cheerful, trusting, oblivious."
    domain: experience
    event_type: observation
    subject: "Vincent Marsh"
    period: "adolescence"
    pad:
      pleasure: -0.4
      arousal: 0.3
      dominance: -0.5
    occ_emotions:
      - type: resentment
        intensity: 0.8
        source: INTRINSIC
    drive_impact:
      curiosity: 0.0
      competence: 0.2
      affiliation: -0.4
      autonomy: -0.3
    catalogue: attachment-trust-erosion
    serves: scheming|defining
    sub_thoughts:
      - type: affect-observation
        text: "Not anger. Something colder. Something patient."
      - type: self-schema
        text: "Watching her skip through rooms that should have been his."
      - type: intention-formation
        text: "Something crystallised. A direction, not a plan. Not yet."

  - id: le-hc-first-plan
    confidence_origin: STATED
    timestamp: "age-18"
    description: "First detailed plan to take what he deserved. Slept better than he had in years. The cousin trusted him completely."
    domain: experience
    event_type: observation
    subject: "Vincent Marsh"
    period: "young-adulthood"
    pad:
      pleasure: 0.5
      arousal: 0.2
      dominance: 0.8
    occ_emotions:
      - type: satisfaction
        intensity: 0.7
        source: INTRINSIC
    drive_impact:
      curiosity: 0.1
      competence: 0.6
      affiliation: 0.0
      autonomy: 0.7
    catalogue: operant-autonomy-reinforcement
    serves: scheming|strong
    sub_thoughts:
      - type: affect-observation
        text: "The deepest rest he had known came from having every piece in place."
      - type: self-schema
        text: "Planning was the only reliable source of safety."
      - type: pattern-recognition
        text: "Her complete trust was the most useful thing about her."
