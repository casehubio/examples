entries:
  - id: le-peter-race
    confidence_origin: STATED
    timestamp: "age-5"
    description: "Father took him to watch a race. Afterward father knelt and looked at him for a long time. That evening couldn't sit still — wanted to do things, show things, be useful."
    domain: experience
    event_type: observation
    subject: "James Hartwell"
    period: "early-childhood"
    pad:
      pleasure: 0.7
      arousal: 0.4
      dominance: 0.3
