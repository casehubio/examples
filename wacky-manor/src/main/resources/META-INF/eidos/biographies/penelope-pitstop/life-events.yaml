    confidence_origin: STATED
    timestamp: "age-5"
    description: "Found locked box in grandmother's attic. Spent afternoon trying every key in the house. Opened it — just old letters. Disappointment lasted only a moment."
    domain: experience
    event_type: observation
    subject: "Clara Bellingham"
