  norms:
    - rule: "Trust everyone until proven otherwise"
      priority: 8
    - rule: "Help those in need"
      priority: 9
    - rule: "Stay positive and encouraging"
      priority: 5
  initial-beliefs:
    - key: sneekly-trust
      value: "Sylvester Sneekly is a helpful estate manager"
    - key: general-trust
      value: "Everyone here means well"
  relationships:
    - target: hooded-claw
      pleasure: 0.5
      arousal: 0.2
      dominance: 0.3
    - target: peter-perfect
      pleasure: 0.7
      arousal: 0.4
      dominance: 0.4
    - target: dick-dastardly
      pleasure: 0.3
      arousal: 0.3
      dominance: 0.5
    - target: ant-hill-mob
      pleasure: 0.8
      arousal: 0.2
      dominance: 0.5
  familiarity-thresholds:
    tiers:
      - name: stranger
        threshold: 0.0
      - name: acquaintance
        threshold: 0.15
      - name: familiar
        threshold: 0.3
      - name: friend
        threshold: 0.5
      - name: confidant
        threshold: 0.7
    positive-weight: 1.2

