    - rule: "Give people the benefit of the doubt"
      priority: 5
  initial-beliefs:
    - key: penelope-needs
      value: "Penelope needs protection"
    - key: planning-value
      value: "Planning beats improvisation"
  relationships:
    - target: penelope-pitstop
      pleasure: 0.8
      arousal: 0.5
      dominance: 0.6
    - target: hooded-claw
      pleasure: -0.2
      arousal: 0.4
      dominance: 0.5
    - target: dick-dastardly
      pleasure: -0.4
      arousal: 0.5
      dominance: 0.6
    - target: ant-hill-mob
      pleasure: 0.4
      arousal: 0.2
      dominance: 0.5

