      description: "Impress Clara Bellingham by being heroic and gallant"
      axis: AFFILIATION
      intensity: 0.8
      formation-reason: character-definition
    - name: find-treasure
      description: "Find the treasure (secondary to impressing Clara)"
      axis: CURIOSITY
      intensity: 0.6
      formation-reason: character-definition
  drives:
    - type: gallantry
      intensity: 0.9
      description: "Must protect and impress Clara"
    - type: proving-worth
      intensity: 0.7
      description: "Needs to demonstrate heroic competence"
    - type: protection
      intensity: 0.8
      description: "Driven to shield others from danger"
  reinforcement:
    conflict_resolution:
      - drive: protection
      - drive: gallantry
    social_interaction:
      - drive: gallantry
      - drive: proving-worth
    trust_change:
      - drive: protection
  norms:
    - rule: "Protect Clara at all costs"
      priority: 9
    - rule: "Give people the benefit of the doubt"
      priority: 5
  initial-beliefs:
    - key: clara-needs
      value: "Clara needs protection"
    - key: planning-value
      value: "Planning beats improvisation"
  relationships:
    - target: penelope-pitstop
      pleasure: 0.8
      arousal: 0.5
      dominance: 0.6
    - target: hooded-claw
      pleasure: -0.2
      arousal: 0.4
      dominance: 0.5
    - target: dick-dastardly
      pleasure: -0.4
      arousal: 0.5
      dominance: 0.6
    - target: ant-hill-mob
      pleasure: 0.4
      arousal: 0.2
      dominance: 0.5

