<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340">
  <style>
    text { font-family: -apple-system, 'Segoe UI', sans-serif; }
    .axis { stroke: #64748b; stroke-width: 1.5; }
    .label { fill: #334155; font-size: 11px; }
    .title { fill: #1e293b; font-size: 13px; font-weight: 600; }
    .grid { stroke: #e2e8f0; stroke-width: 0.5; }
    .line-actual { stroke: #3b82f6; stroke-width: 2.5; fill: none; }
    .line-assumed { stroke: #ef4444; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
    .threshold { stroke: #f59e0b; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .area-actual { fill: #3b82f6; opacity: 0.08; }
    .legend-box { fill: white; stroke: #cbd5e1; stroke-width: 1; rx: 4; }
    .tick-label { fill: #64748b; font-size: 10px; }
    .annotation { fill: #64748b; font-size: 10px; font-style: italic; }
  </style>

  <!-- Grid -->
  <line class="grid" x1="60" y1="60" x2="560" y2="60"/>
  <line class="grid" x1="60" y1="110" x2="560" y2="110"/>
  <line class="grid" x1="60" y1="160" x2="560" y2="160"/>
  <line class="grid" x1="60" y1="210" x2="560" y2="210"/>
  <line class="grid" x1="60" y1="260" x2="560" y2="260"/>

  <!-- Axes -->
  <line class="axis" x1="60" y1="30" x2="60" y2="290"/>
  <line class="axis" x1="60" y1="290" x2="570" y2="290"/>

  <!-- Y-axis labels -->
  <text class="tick-label" x="50" y="293" text-anchor="end">0.0</text>
  <text class="tick-label" x="50" y="243" text-anchor="end">0.2</text>
  <text class="tick-label" x="50" y="193" text-anchor="end">0.4</text>
  <text class="tick-label" x="50" y="143" text-anchor="end">0.6</text>
  <text class="tick-label" x="50" y="93" text-anchor="end">0.8</text>
  <text class="tick-label" x="50" y="43" text-anchor="end">1.0</text>

  <!-- X-axis labels -->
  <text class="tick-label" x="60" y="305" text-anchor="middle">0</text>
  <text class="tick-label" x="135" y="305" text-anchor="middle">3</text>
  <text class="tick-label" x="210" y="305" text-anchor="middle">6</text>
  <text class="tick-label" x="285" y="305" text-anchor="middle">9</text>
  <text class="tick-label" x="360" y="305" text-anchor="middle">12</text>
  <text class="tick-label" x="435" y="305" text-anchor="middle">15</text>
  <text class="tick-label" x="510" y="305" text-anchor="middle">18</text>
  <text class="tick-label" x="560" y="305" text-anchor="middle">20</text>

  <!-- Axis titles -->
  <text class="label" x="310" y="328" text-anchor="middle">Ticks</text>
  <text class="label" x="18" y="160" text-anchor="middle" transform="rotate(-90, 18, 160)">Fatigue</text>

  <!-- Title -->
  <text class="title" x="310" y="22" text-anchor="middle">Fatigue Accumulation: Assumed Linear vs Actual Convergent</text>

  <!-- Threshold line at 0.7 -->
  <line class="threshold" x1="60" y1="108" x2="560" y2="108"/>
  <text class="annotation" x="565" y="112" text-anchor="start">0.7 override</text>

  <!-- Assumed linear: 0.15 per tick, hits 1.0 at tick ~7 -->
  <polyline class="line-assumed" points="
    60,290 85,251 110,213 135,174 160,135 185,96 210,58 235,30
  "/>

  <!-- Actual convergent series: effort decays with fatigue -->
  <!-- Values: 0, 0.07, 0.13, 0.19, 0.25, 0.30, 0.35, 0.40, 0.44, 0.48,
       0.52, 0.55, 0.58, 0.61, 0.64, 0.66, 0.68, 0.70, 0.72, 0.73, 0.75 -->
  <path class="area-actual" d="M60,290 L85,272 110,256 135,241 160,227 185,215 210,204 235,194 260,185 285,177 310,170 335,164 360,158 385,153 410,148 435,144 460,140 485,137 510,134 535,131 560,129 L560,290 Z"/>
  <polyline class="line-actual" points="
    60,290 85,272 110,256 135,241 160,227 185,215
    210,204 235,194 260,185 285,177 310,170 335,164
    360,158 385,153 410,148 435,144 460,140 485,137
    510,134 535,131 560,129
  "/>

  <!-- Legend -->
  <rect class="legend-box" x="380" y="195" width="170" height="55"/>
  <line x1="390" y1="212" x2="420" y2="212" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 4"/>
  <text class="label" x="425" y="216">Assumed (linear 0.15/tick)</text>
  <line x1="390" y1="232" x2="420" y2="232" stroke="#3b82f6" stroke-width="2.5"/>
  <text class="label" x="425" y="236">Actual (effort × 0.15)</text>

  <!-- Annotations -->
  <circle cx="185" cy="215" r="3" fill="#3b82f6"/>
  <text class="annotation" x="190" y="230">tick 5: 0.30</text>

  <circle cx="485" cy="137" r="3" fill="#3b82f6"/>
  <text class="annotation" x="425" y="128">tick 18: 0.70 — override fires</text>
</svg>
