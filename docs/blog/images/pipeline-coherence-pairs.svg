<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#475569" stroke-width="1.2"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#dc2626" stroke-width="1.2"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, 'Segoe UI', sans-serif; }
    .stage { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.5; rx: 8; }
    .stage-label { font-size: 13px; font-weight: 600; fill: #1e293b; text-anchor: middle; }
    .stage-detail { font-size: 10px; fill: #64748b; text-anchor: middle; }
    .flow { stroke: #475569; stroke-width: 1.5; fill: none; }
    .coherence { stroke: #2563eb; stroke-width: 1.5; stroke-dasharray: 6,3; fill: none; }
    .incoherence { stroke: #dc2626; stroke-width: 1.5; stroke-dasharray: 6,3; fill: none; }
    .check-label { font-size: 10px; fill: #2563eb; text-anchor: middle; font-style: italic; }
    .warn-label { font-size: 10px; fill: #dc2626; text-anchor: middle; font-style: italic; }
    .title { font-size: 15px; font-weight: 700; fill: #0f172a; }
  </style>

  <text x="360" y="24" text-anchor="middle" class="title">Pipeline coherence — what the eval validates</text>

  <!-- Stages -->
  <rect x="20" y="55" width="130" height="55" class="stage"/>
  <text x="85" y="78" class="stage-label">Appraisal</text>
  <text x="85" y="94" class="stage-detail">DISTRESS 0.85</text>

  <rect x="195" y="55" width="130" height="55" class="stage"/>
  <text x="260" y="78" class="stage-label">CAPS Settling</text>
  <text x="260" y="94" class="stage-detail">attractor resolution</text>

  <rect x="370" y="55" width="130" height="55" class="stage"/>
  <text x="435" y="78" class="stage-label">Regulation</text>
  <text x="435" y="94" class="stage-detail">ATTENTIONAL_DEPLOY</text>

  <rect x="545" y="55" width="155" height="55" class="stage"/>
  <text x="622" y="78" class="stage-label">Prompt Sections</text>
  <text x="622" y="94" class="stage-detail">mood, drives, appraisal</text>

  <!-- Flow arrows -->
  <line x1="150" y1="82" x2="193" y2="82" class="flow" marker-end="url(#arr)"/>
  <line x1="325" y1="82" x2="368" y2="82" class="flow" marker-end="url(#arr)"/>
  <line x1="500" y1="82" x2="543" y2="82" class="flow" marker-end="url(#arr)"/>

  <!-- Coherence pair 1: appraisal → regulation (passes) -->
  <path d="M85,112 Q85,155 260,155 Q435,155 435,112" class="coherence"/>
  <text x="260" y="172" class="check-label">appraisal → regulation: score 4-5 ✓</text>

  <!-- Coherence pair 2: regulation → prompt (fails partially) -->
  <path d="M435,112 Q435,220 530,220 Q622,220 622,112" class="incoherence" marker-end="url(#arr-red)"/>
  <text x="530" y="240" class="warn-label">regulation → prompt: incoherent</text>
  <text x="530" y="254" class="warn-label">mood says "even" after 0.85 distress</text>

  <!-- Coherence pair 3: cross-tick -->
  <rect x="20" y="280" width="680" height="45" class="stage" style="fill:#f0fdf4; stroke:#86efac;"/>
  <text x="360" y="300" class="stage-label" style="fill:#166534;">Cross-tick trajectory</text>
  <text x="360" y="316" class="stage-detail" style="fill:#166534;">drive stability across 5 ticks — score 5 ✓</text>
</svg>
