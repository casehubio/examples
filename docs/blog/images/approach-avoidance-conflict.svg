<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <style>
    text { font-family: -apple-system, 'Segoe UI', sans-serif; }
    .node { rx: 6; stroke-width: 1.5; }
    .approach { fill: #dbeafe; stroke: #3b82f6; }
    .avoid { fill: #fee2e2; stroke: #ef4444; }
    .neutral { fill: #f1f5f9; stroke: #94a3b8; }
    .node-label { font-size: 11px; font-weight: 600; text-anchor: middle; }
    .axis-label { font-size: 12px; font-weight: 700; text-anchor: middle; }
    .value { font-size: 10px; fill: #64748b; text-anchor: middle; }
    .arrow { stroke-width: 1.2; fill: none; }
    .title { font-size: 14px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .subtitle { font-size: 11px; fill: #64748b; text-anchor: middle; }
  </style>

  <text x="340" y="22" class="title">Approach-avoidance conflict: competitive + avoidant</text>
  <text x="340" y="38" class="subtitle">Both axis pairs seed opposing output attractors at similar resting activations</text>

  <!-- Competitive socialOrient column -->
  <text x="170" y="68" class="axis-label" fill="#2563eb">competitive socialOrient</text>

  <rect x="60" y="80" width="90" height="32" class="node approach"/>
  <text x="105" y="100" class="node-label" fill="#1e40af">approach</text>
  <text x="105" y="123" class="value">+0.20</text>

  <rect x="170" y="80" width="70" height="32" class="node approach"/>
  <text x="205" y="100" class="node-label" fill="#1e40af">fight</text>
  <text x="205" y="123" class="value">+0.15</text>

  <rect x="260" y="80" width="70" height="32" class="node approach"/>
  <text x="295" y="100" class="node-label" fill="#1e40af">assert</text>
  <text x="295" y="123" class="value">+0.15</text>

  <!-- Avoidant conflictMode column -->
  <text x="500" y="68" class="axis-label" fill="#dc2626">avoidant conflictMode</text>

  <rect x="390" y="80" width="70" height="32" class="node avoid"/>
  <text x="425" y="100" class="node-label" fill="#991b1b">flight</text>
  <text x="425" y="123" class="value">+0.15</text>

  <rect x="480" y="80" width="90" height="32" class="node avoid"/>
  <text x="525" y="100" class="node-label" fill="#991b1b">withdraw</text>
  <text x="525" y="123" class="value">+0.10</text>

  <rect x="590" y="80" width="70" height="32" class="node avoid"/>
  <text x="625" y="100" class="node-label" fill="#991b1b">escape</text>
  <text x="625" y="123" class="value">+0.20</text>

  <!-- Conflict zone -->
  <rect x="40" y="145" width="600" height="50" rx="8" fill="#fef9c3" stroke="#eab308" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="340" y="166" font-size="12" font-weight="600" fill="#854d0e" text-anchor="middle">CAPS settling zone — small input perturbations flip the dominant attractor</text>
  <text x="340" y="182" font-size="10" fill="#a16207" text-anchor="middle">approach and avoidance nodes compete at similar activation levels</text>

  <!-- Resolution: without check vs with check -->
  <rect x="40" y="215" width="290" height="70" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
  <text x="185" y="236" font-size="11" font-weight="700" fill="#991b1b" text-anchor="middle">Without coherence check</text>
  <text x="185" y="254" font-size="10" fill="#991b1b" text-anchor="middle">Both approach and avoidance get resting activations.</text>
  <text x="185" y="268" font-size="10" fill="#991b1b" text-anchor="middle">Settling is unstable — same input, different outputs.</text>

  <rect x="350" y="215" width="290" height="70" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
  <text x="495" y="236" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">With coherence check</text>
  <text x="495" y="254" font-size="10" fill="#166534" text-anchor="middle">Conflicting resting activations suppressed.</text>
  <text x="495" y="268" font-size="10" fill="#166534" text-anchor="middle">Settling driven by situation input, not personality noise.</text>
</svg>
