---
playbook: helpdesk-demo
description: Helpdesk case lifecycle — teaching walkthrough + conformance assertions
speed: 1.0
on-error: pause
sections:
- label: Bootstrap
  steps:
  - label: Load classification rules
    step: bootstrap
    target: helpdesk
    bootstrap-classifications:
      entries:
      - match: laptop
        category: HARDWARE
        priority: HIGH
      - match: password
        category: ACCESS
        priority: LOW
      - match: install
        category: SOFTWARE
        priority: MEDIUM
      - match: printer
        category: HARDWARE
        priority: MEDIUM

- label: Platform concepts
  steps:
  - label: What is a Case?
    step: slide-case
    target: browser
    trigger:
      after: bootstrap
      delay: 500
    show-markdown:
      display: modal
      content: |
        ## What is a Case?

        A **case** is a managed lifecycle — a unit of work that moves through defined stages from creation to completion.

        In this helpdesk, each support ticket is a case. The case definition (written in YAML) declares:

        - **Bindings** — reactive rules that fire when the case context changes: classify the ticket, assign a specialist, notify the customer
        - **Workers** — the implementations that execute each binding's capability
        - **Goals** — success conditions that complete the case
        - **Data** — the case context: subject, category, priority, customer reference

        This is a **choreography**, not an orchestration. There is no central controller sequencing steps. Each binding watches for context changes and fires independently — the order emerges from the data.

        === YAML
        ```yaml
        bindings:
          - name: triage
            capability: classify-ticket
            on:
              contextChange:
                filter: '.status == "OPEN" and .category == null'

          - name: assign-specialist
            humanTask:
              candidateGroups: '["hw-specialist"]'
            on:
              contextChange:
                filter: '.status == "TRIAGED"'

          - name: notify-resolution
            capability: notify-customer
            on:
              contextChange:
                filter: '.status == "RESOLVED" and .notified == null'
        ```
  - label: Workers and Bindings
    step: slide-workers
    target: browser
    trigger:
      after: slide-case
    show-markdown:
      display: modal
      content: |
        ## Hybrid Execution

        CaseHub is a **hybrid execution platform**. A single case definition can mix execution models — the engine selects the right one based on how each binding is declared.

        | Model | How it works | Use case |
        | --- | --- | --- |
        | **Choreography** | Bindings fire reactively on context changes | Case lifecycle, event-driven flows |
        | **Orchestration** | Explicit work submission with suspend/resume | Multi-step agent tasks |
        | **Human tasks** | Work items routed to specialist groups | Manual review, approvals |

        ### This helpdesk uses choreography

        The flow *emerges* from data changes. No binding knows about the others:

        1. Ticket arrives → context has `status: OPEN` → **triage** fires
        2. Triage sets `category` and `status: TRIAGED` → **assign-specialist** fires
        3. Specialist resolves → `status: RESOLVED` → **notify-resolution** fires

        Add a new binding and it participates automatically — no rewiring.

- label: Customer submits ticket
  steps:
  - label: Introduction
    step: intro-markdown
    target: browser
    trigger:
      after: slide-workers
      delay: 500
    show-markdown:
      value: |
        ## IT Helpdesk Tutorial

        This scenario walks through a **complete helpdesk case lifecycle** — from ticket submission to resolution and customer notification.

        You'll see how the CaseHub platform:
        - Accepts tickets through a web form
        - Classifies and routes them automatically
        - Manages specialist work items
        - Sends resolution notifications

        *Press Step or Resume to continue.*
  - label: Spotlight the intake form
    step: spotlight-form
    target: browser
    trigger:
      after: intro-markdown
      delay: 500
    spotlight:
      content: >
        The intake form captures the issue and routes to the right
        specialist team. The scenario fills in a hardware issue and
        submits it — just like a real user.
      position: right
      duration: 0
      target:
        role: textbox
        name: Subject
  - label: Fill in subject
    step: fill-subject
    target: browser
    trigger:
      after: spotlight-form
      delay: 500
    fill:
      target:
        role: textbox
        name: Subject
      value: Laptop won't boot
  - label: Fill in description
    step: fill-description
    target: browser
    trigger:
      after: fill-subject
      delay: 300
    fill:
      target:
        role: textbox
        name: Description
      value: MacBook Pro shows black screen after firmware update. Blue screen
        with error code 0xDEAD001 for two seconds, then powers off.
  - label: Submit the ticket
    step: submit-ticket
    target: browser
    trigger:
      after: fill-description
      delay: 500
    click:
      target:
        role: button
        name: Submit

- label: Verify classification
  steps:
  - label: Spotlight the classification
    step: spotlight-classified
    target: browser
    trigger:
      after: submit-ticket
      delay: 1500
    spotlight:
      content: >
        The platform classified "laptop" as HARDWARE with HIGH priority.
        A work item is now assigned to the hardware specialist group.
      position: right
      duration: 0
      target:
        role: status
        name: Ticket confirmation
  - label: Ticket classified as HARDWARE
    step: verify-classification
    target: helpdesk
    trigger:
      after: spotlight-classified
      delay: 500
    verify:
      endpoint: /api/apps/helpdesk/tickets
      expect:
        - match: { subject: "Laptop won't boot" }
          assert:
            category: HARDWARE
            status: TRIAGED
  - label: Work item created
    step: verify-work-item
    target: helpdesk
    trigger:
      after: verify-classification
      delay: 500
    verify:
      endpoint: /api/work/items/list-all
      expect:
        - match: { title-contains: "Laptop won't boot" }
          assert:
            status: PENDING

- label: Work item lifecycle
  steps:
  - label: What are Work Items?
    step: slide-workitems
    target: browser
    trigger:
      after: verify-work-item
      delay: 1000
    show-markdown:
      display: modal
      content: |
        ## Work Items

        A **work item** is a task assigned to a person or group. When the case engine classifies a ticket, it creates a work item and assigns it to the matching specialist group.

        Work items have their own lifecycle:

        - **PENDING** — created, waiting for someone to claim it
        - **IN_PROGRESS** — a specialist claimed the item and is working on it
        - **COMPLETED** — the specialist resolved the issue

        Each status change fires a push event — no polling, no refresh.
  - label: Claim, Resolve, Notify
    step: slide-resolve
    target: browser
    trigger:
      after: slide-workitems
    show-markdown:
      display: modal
      content: |
        ## Claim, Resolve, Notify

        **1. Claim** — the specialist claims the work item (PENDING → IN_PROGRESS).

        **2. Resolve** — the specialist enters a resolution and completes the work item.

        **3. Notify** — the case's *notify-customer* binding fires automatically on resolution.

        This chain is entirely driven by the case definition. No application code orchestrates the sequence. The engine follows the YAML.

- label: Specialist resolves ticket
  steps:
  - label: Claim work item
    step: claim-work-item
    target: browser
    trigger:
      after: slide-resolve
      delay: 1000
    click:
      target:
        role: button
        name: Claim
  - label: Enter resolution
    step: enter-resolution
    target: browser
    trigger:
      after: claim-work-item
      delay: 500
    fill:
      target:
        role: textbox
        name: Resolution
      value: BIOS reset resolved the boot loop. Firmware rollback applied.
  - label: Resolve ticket
    step: resolve-ticket
    target: browser
    trigger:
      after: enter-resolution
      delay: 500
    click:
      target:
        role: button
        name: Resolve

- label: Verify completion
  steps:
  - label: Case resolved and notified
    step: verify-case-complete
    target: helpdesk
    trigger:
      after: resolve-ticket
      delay: 2000
    verify:
      endpoint: /api/apps/helpdesk/tickets
      expect:
        - match: { subject: "Laptop won't boot" }
          assert:
            status: RESOLVED
            notified: true
  - label: Lifecycle summary
    step: summary-markdown
    target: browser
    trigger:
      after: verify-case-complete
      delay: 1000
    show-markdown:
      value: |
        ## Lifecycle Complete

        The full helpdesk lifecycle ran end-to-end:

        1. **Intake** — customer submitted a ticket via the web form
        2. **Classification** — the engine classified "laptop" as HARDWARE
        3. **Routing** — a work item was created and assigned to the hardware group
        4. **Resolution** — a specialist claimed, resolved, and closed the ticket
        5. **Notification** — the customer received a resolution message

        Every stage is an **SPI boundary** — swap the classifier, notification channel, or routing logic without changing application code.

        The same playbook YAML that drove this demo also runs as an automated test in CI.
