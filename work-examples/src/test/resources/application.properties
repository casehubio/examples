# Prevents TIME_WAIT port conflicts when multiple @QuarkusTest classes run in sequence
quarkus.http.test-port=0
quarkus.datasource.jdbc.url=jdbc:h2:mem:examples;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
# casehub-ledger#95 moved base migrations to db/ledger/migration/ — include both paths
quarkus.flyway.locations=classpath:db/work/migration,classpath:db/ledger/migration,classpath:db/view/migration
quarkus.scheduler.start-mode=halted
# Use the platform group-membership producer instead of the Work fallback.
quarkus.arc.exclude-types=io.casehub.work.runtime.service.NoOpGroupMembershipProvider
# Select the JPA @Alternative for ActorTrustScoreRepository — without this,
# the @DefaultBean NoOpActorTrustScoreRepository silently swallows all writes.
quarkus.arc.selected-alternatives=io.casehub.ledger.runtime.repository.jpa.JpaActorTrustScoreRepository
