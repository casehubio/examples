---
playbook: helpdesk-demo
description: YAML helpdesk case lifecycle — simulator classification, eidos routing, push notifications
speed: 1.0
on-error: pause
sections:
- label: Bootstrap
  steps:
  - label: Seed data loaded
    step: bootstrap
    target: helpdesk
    bootstrap-classifications:
      entries:
      - match: laptop
        category: HARDWARE
        priority: HIGH
      - match: monitor
        category: HARDWARE
        priority: MEDIUM
      - match: keyboard
        category: HARDWARE
        priority: LOW
      - match: printer
        category: HARDWARE
        priority: MEDIUM
      - match: dock
        category: HARDWARE
        priority: HIGH
      - match: wifi
        category: HARDWARE
        priority: URGENT
      - match: password
        category: ACCESS
        priority: LOW
      - match: access
        category: ACCESS
        priority: LOW
      - match: login
        category: ACCESS
        priority: LOW
      - match: vpn
        category: ACCESS
        priority: MEDIUM
      - match: membership
        category: ACCESS
        priority: LOW
      - match: jira
        category: ACCESS
        priority: LOW
      - match: install
        category: SOFTWARE
        priority: MEDIUM
      - match: update
        category: SOFTWARE
        priority: MEDIUM
      - match: license
        category: SOFTWARE
        priority: HIGH
      - match: ide
        category: SOFTWARE
        priority: HIGH
      - match: docker
        category: SOFTWARE
        priority: HIGH
      - match: slack
        category: SOFTWARE
        priority: LOW
- label: Customer submits ticket
  steps:
  - label: Fill in subject
    step: fill-subject
    target: browser
    trigger:
      after: bootstrap
      delay: 500
    fill:
      target:
        role: textbox
        name: Subject
      value: Laptop won't boot
  - label: Fill in description
    step: fill-description
    target: browser
    trigger:
      after: fill-subject
      delay: 300
    fill:
      target:
        role: textbox
        name: Description
      value: MacBook Pro shows black screen after firmware update. Blue screen with error code 0xDEAD001 for two seconds, then powers off.
  - label: Submit the ticket
    step: submit-ticket
    target: browser
    trigger:
      after: fill-description
      delay: 500
    click:
      target:
        role: button
        name: Submit
- label: Verify classification
  steps:
  - label: Verify ticket classified by simulator
    step: verify-classification
    target: helpdesk
    trigger:
      after: submit-ticket
      delay: 1500
    verify:
      endpoint: /api/apps/helpdesk/tickets
      expect:
        - match: { subject: "Laptop won't boot" }
          assert:
            category: HARDWARE
            priority: HIGH
            status: TRIAGED
  - label: Verify work item created
    step: verify-work-item
    target: helpdesk
    trigger:
      after: verify-classification
      delay: 500
    verify:
      endpoint: /api/work/items/list-all
      expect:
        - match: { title-contains: "Laptop won't boot" }
          assert:
            status: PENDING
- label: Specialist resolves ticket
  steps:
  - label: Claim work item
    step: claim-work-item
    target: browser
    trigger:
      after: verify-work-item
      delay: 1000
    click:
      target:
        role: button
        name: Claim
  - label: Enter resolution
    step: enter-resolution
    target: browser
    trigger:
      after: claim-work-item
      delay: 500
    fill:
      target:
        role: textbox
        name: Resolution
      value: BIOS reset resolved the boot loop. Firmware rollback applied.
  - label: Resolve ticket
    step: resolve-ticket
    target: browser
    trigger:
      after: enter-resolution
      delay: 500
    click:
      target:
        role: button
        name: Resolve
- label: Verify resolution
  steps:
  - label: Verify notification sent
    step: verify-notification
    target: helpdesk
    trigger:
      after: resolve-ticket
      delay: 2000
    verify:
      endpoint: /api/push/topics/helpdesk:notifications
      expect:
        - assert:
            to: { not-empty: true }
            message: { contains: "Laptop won't boot" }
  - label: Verify case complete
    step: verify-case-complete
    target: helpdesk
    trigger:
      after: verify-notification
      delay: 500
    verify:
      endpoint: /api/apps/helpdesk/tickets
      expect:
        - match: { subject: "Laptop won't boot" }
          assert:
            status: RESOLVED
            notified: true
