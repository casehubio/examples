properties:
  refreshInterval: 10
  metricsUrl: /data/quarkus/metrics
  historyUrl: /data/quarkus/history.json
global:
  mode: dark
  displayer:
    chart:
      resizable: true
      height: 350
      grid:
        x: false
    columns:
    - id: Total
      pattern: '#'
    - id: Value
      pattern: '#'
datasets:
- uuid: all_metrics
  url: ${metricsUrl}
  cacheEnabled: true
  refreshTime: 5second
- uuid: live_metrics
  url: ${metricsUrl}
  accumulate: true
  cacheMaxRows: 10000
  refreshTime: 3second
  expression: |-
    $map($, function($v){
        [$v[0], $v[1], $v[2] = 'NaN' ? -1 : $v[2], $now() ~> $toMillis()]
    })
  columns:
  - id: metric
    type: LABEL
  - id: labels
    type: LABEL
  - id: value
    type: NUMBER
  - id: timestamp
    type: NUMBER
- uuid: history
  url: ${historyUrl}
  columns:
  - id: metric
    type: LABEL
  - id: labels
    type: LABEL
  - id: value
    type: NUMBER
  - id: timestamp
    type: NUMBER
pages:
- name: index
  components:
  - type: SIDEBAR
    properties:
      navGroupId: QuarkusNav
- name: Current Status
  grid:
  - at: {x: 0, y: 0, w: 3, h: 1}
    type: metric
    properties:
      title: CPU Usage
      lookup:
        uuid: all_metrics
        filter:
        - column: Metric
          function: EQUALS_TO
          args:
          - system_cpu_usage
        group:
        - functions:
          - source: Value
            function: MAX
            column: CPU
      columns:
      - id: CPU
        expression: value * 100
        pattern: '#'
  - at: {x: 3, y: 0, w: 3, h: 1}
    type: metric
    properties:
      title: Open Files
      lookup:
        uuid: all_metrics
        filter:
        - column: Metric
          function: EQUALS_TO
          args:
          - process_files_open_files
        group:
        - functions:
          - source: Value
            function: MAX
            column: Total
  - at: {x: 6, y: 0, w: 3, h: 1}
    type: metric
    properties:
      visible: true
      title: Uptime
      lookup:
        uuid: all_metrics
        filter:
        - column: Metric
          function: EQUALS_TO
          args:
          - process_uptime_seconds
        group:
        - functions:
          - source: Value
            function: MAX
            column: UPTIME
      columns:
      - id: UPTIME
        pattern: '#'
        expression: value / 60
  - at: {x: 9, y: 0, w: 3, h: 1}
    type: metric
    properties:
      title: Peak Threads
      lookup:
        uuid: all_metrics
        filter:
        - column: Metric
          function: EQUALS_TO
          args:
          - jvm_threads_peak_threads
        group:
        - functions:
          - source: Value
  - at: {x: 0, y: 1, w: 6, h: 1}
    type: bar-chart
    properties:
      title: JVM Memory Used Bytes (heap)
      lookup:
        uuid: all_metrics
        filter:
        - column: Metric
          function: EQUALS_TO
          args:
          - jvm_memory_used_bytes
        - column: labels
          function: LIKE_TO
          args:
          - heap%
        sort:
        - column: Total
          sortOrder: DESCENDING
        group:
        - columnGroup:
            source: Labels
          functions:
          - source: Labels
          - source: Value
            function: MAX
            column: Total
      columns:
      - id: Labels
        expression: value.replace("heap, ", "");
      extraConfiguration: |-
        {
          "color" : ["#5ec962"]
        }
  - at: {x: 6, y: 1, w: 6, h: 1}
    type: bar-chart
    properties:
      title: JVM Memory Used Bytes (nonheap)
      lookup:
        uuid: all_metrics
        filter:
        - column: Metric
          function: EQUALS_TO
          args:
          - jvm_memory_used_bytes
        - column: labels
          function: LIKE_TO
          args:
          - nonheap%
        sort:
        - column: Total
          sortOrder: DESCENDING
        group:
        - columnGroup:
            source: Labels
          functions:
          - source: Labels
          - source: Value
            function: MAX
            column: Total
      columns:
      - id: Labels
        expression: value.replace("nonheap, ", "");
      extraConfiguration: |-
        {
          "color" : ["#5ec962"]
        }
  - at: {x: 0, y: 2, w: 12, h: 1}
    type: bar-chart
    properties:
      title: Threads
      lookup:
        uuid: all_metrics
        filter:
        - column: Metric
          function: EQUALS_TO
          args:
          - jvm_threads_states_threads
        sort:
        - column: Total
          sortOrder: DESCENDING
        group:
        - columnGroup:
            source: Labels
          functions:
          - source: Labels
          - source: Value
            function: MAX
            column: Total
      columns:
      - id: Labels
        expression: value;
      extraConfiguration: |-
        {
          "color" : ["#4695EB"]
        }
- name: History
  grid:
  - at: {x: 0, y: 0, w: 6, h: 1}
    type: timeseries
    properties:
      title: Heap Memory Usage
      lookup:
        uuid: history
        filter:
        - column: metric
          function: EQUALS_TO
          args:
          - jvm_memory_used_bytes
        - column: labels
          function: LIKE_TO
          args:
          - heap%
        group:
        - functions:
          - source: labels
          - source: timestamp
          - source: value
      chart:
        height: 300
  - at: {x: 6, y: 0, w: 6, h: 1}
    type: timeseries
    properties:
      title: CPU Usage
      lookup:
        uuid: history
        filter:
        - column: metric
          function: EQUALS_TO
          args:
          - system_cpu_usage
        group:
        - functions:
          - source: metric
          - source: timestamp
          - source: value
      chart:
        height: 300
  - at: {x: 0, y: 1, w: 6, h: 1}
    type: timeseries
    properties:
      title: Live Threads
      lookup:
        uuid: history
        filter:
        - column: metric
          function: EQUALS_TO
          args:
          - jvm_threads_live_threads
        group:
        - functions:
          - source: metric
          - source: timestamp
          - source: value
      chart:
        height: 300
  - at: {x: 6, y: 1, w: 6, h: 1}
    type: timeseries
    properties:
      title: Loaded Classes
      lookup:
        uuid: history
        filter:
        - column: metric
          function: EQUALS_TO
          args:
          - jvm_classes_loaded_classes
        group:
        - functions:
          - source: metric
          - source: timestamp
          - source: value
      chart:
        height: 300
- name: Live
  grid:
  - at: {x: 0, y: 0, w: 12, h: 1}
    type: timeseries
    properties:
      title: Live CPU Usage (accumulating)
      lookup:
        uuid: live_metrics
        filter:
        - column: metric
          function: EQUALS_TO
          args:
          - system_cpu_usage
        group:
        - functions:
          - source: metric
          - source: timestamp
          - source: value
      chart:
        height: 350
        zoom: true
  - at: {x: 0, y: 1, w: 6, h: 1}
    type: timeseries
    properties:
      title: Live Threads (accumulating)
      lookup:
        uuid: live_metrics
        filter:
        - column: metric
          function: EQUALS_TO
          args:
          - jvm_threads_live_threads
        group:
        - functions:
          - source: metric
          - source: timestamp
          - source: value
      chart:
        height: 300
  - at: {x: 6, y: 1, w: 6, h: 1}
    type: timeseries
    properties:
      title: Live Memory (accumulating)
      lookup:
        uuid: live_metrics
        filter:
        - column: metric
          function: EQUALS_TO
          args:
          - jvm_memory_used_bytes
        - column: labels
          function: LIKE_TO
          args:
          - heap%
        group:
        - functions:
          - source: labels
          - source: timestamp
          - source: value
      chart:
        height: 300
navTree:
  root_items:
  - type: GROUP
    id: QuarkusNav
    children:
    - page: Current Status
    - page: History
    - page: Live
