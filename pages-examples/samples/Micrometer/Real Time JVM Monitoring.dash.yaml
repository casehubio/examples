properties:
  metricsUrl: /data/quarkus/metrics
  historyUrl: /data/quarkus/history.json
global:
  displayer:
    chart:
      resizable: true
    lookup:
      uuid: metrics
datasets:
- uuid: history
  url: ${historyUrl}
  columns:
  - id: metric
    type: LABEL
  - id: labels
    type: LABEL
  - id: value
    type: NUMBER
  - id: timestamp
    type: NUMBER
- uuid: metrics
  url: ${metricsUrl}
  accumulate: true
  cacheMaxRows: 30000
  refreshTime: 2second
  expression: "$map($, function($v){\n    [$v[0], $v[1], $v[2] = 'NaN' ? -1 : $v[2], $now() ~> $toMillis()]\n})"
  columns:
  - id: metric
    type: label
  - id: labels
    type: label
  - id: value
    type: number
  - id: register
    type: number
pages:
- properties:
    margin-left: 10px
  grid:
  - at: {x: 0, y: 0, w: 6, h: 1}
    type: ''
    properties:
      lookup:
        group:
        - columnGroup:
            source: register
          functions:
          - source: metric
          - source: register
          - source: value
            function: SUM
  - at: {x: 0, y: 1, w: 6, h: 1}
    type: timeseries
    properties:
      title: Heap Memory Usage
      lookup:
        uuid: history
        filter:
        - column: metric
          function: EQUALS_TO
          args:
          - jvm_memory_used_bytes
        - column: labels
          function: LIKE_TO
          args:
          - '%heap%'
        group:
        - functions:
          - source: labels
          - source: timestamp
          - source: value
      chart:
        height: 300
  - at: {x: 6, y: 1, w: 6, h: 1}
    type: timeseries
    properties:
      title: Live Threads
      lookup:
        uuid: history
        filter:
        - column: metric
          function: EQUALS_TO
          args:
          - jvm_threads_live_threads
        group:
        - functions:
          - source: metric
          - source: timestamp
          - source: value
      chart:
        height: 300
  - at: {x: 0, y: 2, w: 6, h: 1}
    type: timeseries
    properties:
      title: Loaded Classes
      lookup:
        uuid: history
        filter:
        - column: metric
          function: EQUALS_TO
          args:
          - jvm_classes_loaded_classes
        group:
        - functions:
          - source: metric
          - source: timestamp
          - source: value
      chart:
        height: 300
  - at: {x: 6, y: 2, w: 6, h: 1}
    type: timeseries
    properties:
      title: CPU Usage
      lookup:
        uuid: history
        filter:
        - column: metric
          function: EQUALS_TO
          args:
          - system_cpu_usage
        group:
        - functions:
          - source: metric
          - source: timestamp
          - source: value
      chart:
        height: 300
