global:
  displayer:
    extraConfiguration: "{\n   \n    \"series\": [{\n        \"type\": \"bar\",\n        \"itemStyle\": {\n            \"\
      normal\": {\n                \"label\": {\n                    \"show\": true,\n                    \"position\": \"\
      top\",\n                    \"fontSize\": 10\n                    \n                }\n            }\n        }\n  \
      \  }]\n}"
    chart:
      resizable: true
    columns:
    - id: labels
      expression: value.split(",")[0].replaceAll("version=", "") .replaceAll("\"", "") .replaceAll("type=", "")
    lookup:
      uuid: metrics
datasets:
- uuid: metrics
  url: metrics
  cacheEnabled: true
pages:
- name: index
  grid:
  - at: {x: 0, y: 0, w: 12, h: 1}
    screen: Cards
  - at: {x: 0, y: 1, w: 12, h: 1}
    panel: Charts
  - at: {x: 0, y: 2, w: 12, h: 1}
    panel: Metrics Table
- name: Cards
  properties:
    margin-top: 10px
  grid:
  - at: {x: 0, y: 0, w: 3, h: 1}
    type: metric
    properties:
      title: Node Version
      lookup:
        filter:
        - column: metric
          function: EQUALS_TO
          args:
          - nodejs_version_info
        group:
        - functions:
          - source: labels
  - at: {x: 3, y: 0, w: 3, h: 1}
    type: metric
    properties:
      title: Started
      lookup:
        filter:
        - column: metric
          function: EQUALS_TO
          args:
          - process_start_time_seconds
        group:
        - functions:
          - source: value
      columns:
      - id: value
        expression: "new Date(value * 1000).toISOString()\n                      .substring(0, 19)\n                     \
          \ .replace(\"T\", \" \")"
  - at: {x: 6, y: 0, w: 3, h: 1}
    type: metric
    properties:
      title: Heap Bytes
      lookup:
        filter:
        - column: metric
          function: EQUALS_TO
          args:
          - process_heap_bytes
        group:
        - functions:
          - source: value
      columns:
      - id: value
        expression: parseInt(value / (1024 * 1024)) + " MB"
  - at: {x: 9, y: 0, w: 3, h: 1}
    type: metric
    properties:
      title: Open Files
      lookup:
        filter:
        - column: metric
          function: EQUALS_TO
          args:
          - process_open_fds
        group:
        - functions:
          - source: value
      columns:
      - id: value
        pattern: '#'
- name: Charts
  grid:
  - at: {x: 0, y: 0, w: 4, h: 1}
    type: bar-chart
    properties:
      title: Active Resources
      lookup:
        sort:
        - column: value
          order: DESCENDING
        group:
        - functions:
          - source: labels
          - source: value
        filter:
        - column: metric
          function: EQUALS_TO
          args:
          - nodejs_active_resources
      columns:
      - id: value
        pattern: '#'
      axis:
        x:
          labels_angle: -10
  - at: {x: 4, y: 0, w: 4, h: 1}
    type: bar-chart
    properties:
      title: Event Loop Lag (seconds)
      lookup:
        sort:
        - column: metric
          order: DESCENDING
        group:
        - functions:
          - source: metric
          - source: value
        filter:
        - column: metric
          function: EQUALS_TO
          args:
          - nodejs_eventloop_lag_min_seconds
          - nodejs_eventloop_lag_max_seconds
          - nodejs_eventloop_lag_mean_seconds
      columns:
      - id: metric
        expression: "lbl = \"Mean\"; if (value === \"nodejs_eventloop_lag_min_seconds\") \n  lbl = \"Min\";\nif (value ===\
          \ \"nodejs_eventloop_lag_max_seconds\")\n  lbl = \"Max\";\nlbl;"
  - at: {x: 8, y: 0, w: 4, h: 1}
    type: bar-chart
    properties:
      title: Used Bytes (MB)
      lookup:
        sort:
        - column: value
          order: DESCENDING
        group:
        - functions:
          - source: metric
          - source: value
        filter:
        - column: metric
          function: EQUALS_TO
          args:
          - nodejs_heap_size_total_bytes
          - nodejs_heap_size_used_bytes
      columns:
      - id: metric
        expression: value.replaceAll("nodejs_heap_size_", "") .replaceAll("_bytes", "")
      - id: value
        expression: parseInt(value / (1024 * 1024))
        pattern: '#'
- name: Metrics Table
  grid:
  - at: {x: 0, y: 0, w: 12, h: 1}
    type: ''
    properties:
      lookup:
        .filter:
        - function: NOT_EQUALS_TO
          column: metric
          args:
          - process_open_fds
          - process_max_fds
          - process_start_time_seconds
          - nodejs_active_resources
          - nodejs_version_info
          - process_heap_bytes
          - nodejs_eventloop_lag_min_seconds
          - nodejs_eventloop_lag_max_seconds
          - nodejs_eventloop_lag_mean_seconds
          - nodejs_heap_size_total_bytes
          - nodejs_heap_space_size_used_bytes
          - nodejs_external_memory_bytes
          - up
        group:
        - functions:
          - source: metric
          - source: value
          columnGroup:
            source: metric
