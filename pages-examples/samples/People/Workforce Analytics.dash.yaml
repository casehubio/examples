  columns:
  - id: id
    type: NUMBER
  - id: name
    type: TEXT
  - id: department
    type: LABEL
  - id: level
    type: LABEL
  - id: tenure
    type: NUMBER
  - id: salary
    type: NUMBER
  - id: rating
    type: NUMBER
  - id: location
    type: LABEL
  - id: gender
    type: LABEL
  - id: startDate
    type: DATE
pages:
- grid:
  - at: {x: 0, y: 0, w: 12, h: 1}
    type: selector
    properties:
      lookup:
        uuid: employees
        group:
        - columnGroup:
            source: department
          functions:
          - source: department
      filter:
        enabled: true
        notification: true
  - at: {x: 0, y: 1, w: 4, h: 1}
    type: pie-chart
    properties:
      title: Headcount
      lookup:
        uuid: employees
        group:
        - columnGroup:
            source: department
          functions:
          - source: department
          - source: department
            function: COUNT
            column: count
      filter:
        listening: true
  - at: {x: 4, y: 1, w: 4, h: 1}
    type: bar-chart
    properties:
      title: Level Distribution
      lookup:
        uuid: employees
        group:
        - columnGroup:
            source: level
          functions:
          - source: level
          - source: level
            function: COUNT
            column: count
      filter:
        listening: true
  - at: {x: 8, y: 1, w: 4, h: 1}
    type: bar-chart
    properties:
      title: Avg Salary by Level
      lookup:
        uuid: employees
        sort:
        - column: Salary
          order: ASCENDING
        group:
        - columnGroup:
            source: level
          functions:
          - source: level
          - source: salary
            function: AVERAGE
            column: Salary
      chart:
        margin:
          left: 80
      filter:
        listening: true
  - at: {x: 0, y: 2, w: 8, h: 1}
    type: scatter-chart
    properties:
      title: Tenure vs Salary
      lookup:
        uuid: employees
        group:
        - columnGroup:
            source: name
          functions:
          - source: tenure
          - source: salary
      filter:
        listening: true
  - at: {x: 8, y: 2, w: 4, h: 1}
    type: pie-chart
    properties:
      title: Rating Distribution
      lookup:
        uuid: employees
        group:
        - columnGroup:
            source: rating
          functions:
          - source: rating
          - source: rating
            function: COUNT
            column: count
      filter:
        listening: true
  - at: {x: 0, y: 3, w: 12, h: 1}
    type: ''
    properties:
      lookup:
        uuid: employees
      columns:
      - id: salary
        pattern: $#,###
      filter:
        listening: true
