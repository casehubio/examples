  - id: type
    type: LABEL
  - id: installDate
    type: DATE
  - id: status
    type: LABEL
pages:
- name: index
  components:
  - type: SIDEBAR
    properties:
      navGroupId: IoTNav
- name: Fleet Status
  grid:
  - at: {x: 0, y: 0, w: 3, h: 1}
    type: metric
    properties:
      title: Devices Online
      lookup:
        uuid: devices
        filter:
        - column: status
          function: NOT_IN
          args:
          - Offline
        group:
        - functions:
          - source: deviceId
            function: COUNT
      columns:
      - id: deviceId
        pattern: '#'
  - at: {x: 3, y: 0, w: 3, h: 1}
    type: metric
    properties:
      title: Avg Temperature
      lookup:
        uuid: sensor_readings
        group:
        - functions:
          - source: temperature
            function: AVERAGE
  - at: {x: 6, y: 0, w: 3, h: 1}
    type: metric
    properties:
      title: Avg Humidity
      lookup:
        uuid: sensor_readings
        group:
        - functions:
          - source: humidity
            function: AVERAGE
  - at: {x: 9, y: 0, w: 3, h: 1}
    type: metric
    properties:
      title: Low Battery
      lookup:
        uuid: sensor_readings
        filter:
        - column: battery
          function: LOWER_THAN
          args:
          - '20'
        group:
        - functions:
          - source: battery
            function: COUNT
      columns:
      - id: battery
        pattern: '#'
  - at: {x: 0, y: 1, w: 8, h: 1}
    type: ''
    properties:
      title: Device Registry
      lookup:
        uuid: devices
      filter:
        listening: true
  - at: {x: 8, y: 1, w: 4, h: 1}
    type: meterchart
    properties:
      title: Temperature
      lookup:
        uuid: sensor_readings
        group:
        - functions:
          - source: temperature
            function: AVERAGE
      filter:
        listening: true
  - at: {x: 8, y: 2, w: 4, h: 1}
    type: meterchart
    properties:
      title: Humidity
      lookup:
        uuid: sensor_readings
        group:
        - functions:
          - source: humidity
            function: AVERAGE
      filter:
        listening: true
  - at: {x: 8, y: 3, w: 4, h: 1}
    type: meterchart
    properties:
      title: Pressure (hPa)
      lookup:
        uuid: sensor_readings
        group:
        - functions:
          - source: pressure
            function: AVERAGE
      filter:
        listening: true
  - at: {x: 0, y: 4, w: 12, h: 1}
    type: selector
    properties:
      lookup:
        uuid: sensor_readings
        group:
        - columnGroup:
            source: location
          functions:
          - source: location
      filter:
        notification: true
- name: Sensor History
  grid:
  - at: {x: 0, y: 0, w: 12, h: 1}
    type: area-chart
    properties:
      title: Temperature by Device
      lookup:
        uuid: sensor_readings
        group:
        - columnGroup:
            source: deviceId
          functions:
          - source: deviceId
          - source: temperature
            function: AVERAGE
      chart:
        zoom: true
  - at: {x: 0, y: 1, w: 6, h: 1}
    type: line-chart
    properties:
      title: Humidity by Device
      lookup:
        uuid: sensor_readings
        group:
        - columnGroup:
            source: deviceId
          functions:
          - source: deviceId
          - source: humidity
            function: AVERAGE
  - at: {x: 6, y: 1, w: 6, h: 1}
    type: area-chart
    properties:
      title: Pressure by Device
      lookup:
        uuid: sensor_readings
        group:
        - columnGroup:
            source: deviceId
          functions:
          - source: deviceId
          - source: pressure
            function: AVERAGE
  - at: {x: 0, y: 2, w: 12, h: 1}
    type: timeseries
    properties:
      title: Battery Level
      lookup:
        uuid: sensor_readings
        group:
        - columnGroup:
            source: timestamp
          functions:
          - source: timestamp
          - source: battery
            function: AVERAGE
- name: Device Detail
  grid:
  - at: {x: 0, y: 0, w: 12, h: 1}
    type: ''
    properties:
      title: Devices
      lookup:
        uuid: devices
      filter:
        listening: true
        notification: true
  - at: {x: 0, y: 1, w: 6, h: 1}
    type: bar-chart
    properties:
      title: Readings by Device
      lookup:
        uuid: sensor_readings
        group:
        - columnGroup:
            source: deviceId
          functions:
          - source: deviceId
          - source: temperature
            function: AVERAGE
          - source: humidity
            function: AVERAGE
      filter:
        listening: true
  - at: {x: 6, y: 1, w: 6, h: 1}
    type: pie-chart
    properties:
      title: Devices by Type
      lookup:
        uuid: devices
        group:
        - columnGroup:
            source: type
          functions:
          - source: type
          - source: type
            function: COUNT
      filter:
        listening: true
  - at: {x: 0, y: 2, w: 12, h: 1}
    type: ''
    properties:
      title: Sensor Readings
      lookup:
        uuid: sensor_readings
      columns:
      - id: battery
        pattern: '##%'
      filter:
        listening: true
navTree:
  root_items:
  - type: GROUP
    id: IoTNav
    children:
    - page: Fleet Status
    - page: Sensor History
    - page: Device Detail
