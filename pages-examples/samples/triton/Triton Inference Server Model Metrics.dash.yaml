properties:
  metricsUrl: /data/triton/metrics
global:
  displayer:
    chart:
      resizable: true
    columns:
    - id: label
      expression: value.replace(/[a-z_]+="|"/g, '').replace(/,$/,'')
datasets:
- uuid: metrics
  url: ${metricsUrl}
  columns:
  - id: metric
    type: LABEL
  - id: labels
    type: LABEL
  - id: value
    type: NUMBER
pages:
- properties:
    margin-left: 5px
  grid:
  - at: {x: 0, y: 0, w: 12, h: 1}
    type: html
    properties:
      content: Triton Inference Server <hr />
  - at: {x: 0, y: 1, w: 3, h: 1}
    type: metric
    properties:
      title: Running Models
      lookup:
        uuid: metrics
        filter:
        - column: metric
          function: EQUALS_TO
          args:
          - nv_inference_count
        group:
        - functions:
          - source: labels
            function: COUNT
      columns:
      - id: labels
        pattern: '#'
  - at: {x: 3, y: 1, w: 3, h: 1}
    type: metric
    properties:
      title: Inference Count
      visible: 'true'
      lookup:
        uuid: metrics
        filter:
        - column: metric
          function: EQUALS_TO
          args:
          - nv_inference_count
        group:
        - functions:
          - source: value
            function: SUM
      columns:
      - id: value
        pattern: '#'
  - at: {x: 6, y: 1, w: 3, h: 1}
    type: metric
    properties:
      title: Inference Requests Success
      visible: 'true'
      lookup:
        uuid: metrics
        filter:
        - column: metric
          function: EQUALS_TO
          args:
          - nv_inference_request_success
        group:
        - functions:
          - source: value
            function: SUM
      columns:
      - id: value
        pattern: '#'
  - at: {x: 9, y: 1, w: 3, h: 1}
    type: metric
    properties:
      title: Inference Requests Failure
      visible: 'true'
      lookup:
        uuid: metrics
        filter:
        - column: metric
          function: EQUALS_TO
          args:
          - nv_inference_request_failure
        group:
        - functions:
          - source: value
            function: SUM
      columns:
      - id: value
        pattern: '#'
  - at: {x: 0, y: 2, w: 12, h: 1}
    type: html
    properties:
      content: <strong>Filter by Model</strong>
  - at: {x: 0, y: 3, w: 12, h: 1}
    type: selector
    properties:
      lookup:
        uuid: metrics
        filter:
        - column: metric
          function: EQUALS_TO
          args:
          - nv_inference_count
        group:
        - columnGroup:
            source: labels
          functions:
          - source: labels
            column: model
      columns:
      - id: model
        expression: value.replaceAll("\"", "").replaceAll("model=", "").replaceAll("version=", "").replaceAll(",", " v")
      filter:
        notification: 'true'
  - at: {x: 0, y: 4, w: 4, h: 1}
    type: bar-chart
    properties:
      title: Inference Count
      lookup:
        uuid: metrics
        sort:
        - column: value
          sortOrder: DESCENDING
        filter:
        - column: metric
          function: EQUALS_TO
          args:
          - nv_inference_count
        - column: value
          function: GREATER_THAN
          args:
          - 0
        group:
        - columnGroup:
            source: labels
          functions:
          - source: labels
          - source: value
            function: SUM
      columns:
      - id: labels
        expression: value.replaceAll("\"", "").replaceAll("model=", "").replaceAll("version=", "").replaceAll(",", " v")
      - id: value
        pattern: '#'
      filter:
        listening: 'true'
  - at: {x: 4, y: 4, w: 4, h: 1}
    type: bar-chart
    properties:
      title: Sucessful Inferences
      lookup:
        uuid: metrics
        sort:
        - column: value
          sortOrder: DESCENDING
        filter:
        - column: metric
          function: EQUALS_TO
          args:
          - nv_inference_request_success
        - column: value
          function: GREATER_THAN
          args:
          - 0
        group:
        - columnGroup:
            source: labels
          functions:
          - source: labels
          - source: value
            function: SUM
      columns:
      - id: labels
        expression: value.replaceAll("\"", "").replaceAll("model=", "").replaceAll("version=", "").replaceAll(",", " v")
      - id: value
        pattern: '#'
      filter:
        listening: 'true'
  - at: {x: 8, y: 4, w: 4, h: 1}
    type: bar-chart
    properties:
      title: Failed Inferences
      lookup:
        uuid: metrics
        sort:
        - column: value
          sortOrder: DESCENDING
        filter:
        - column: metric
          function: EQUALS_TO
          args:
          - nv_inference_request_failure
        - column: value
          function: GREATER_THAN
          args:
          - 0
        group:
        - columnGroup:
            source: labels
          functions:
          - source: labels
          - source: value
            function: SUM
      columns:
      - id: labels
        expression: value.replaceAll("\"", "").replaceAll("model=", "").replaceAll("version=", "").replaceAll(",", " v")
      - id: value
        pattern: '#'
      filter:
        listening: 'true'
  - at: {x: 0, y: 5, w: 4, h: 1}
    type: bar-chart
    properties:
      title: Inference Request Duration
      lookup:
        uuid: metrics
        sort:
        - column: value
          sortOrder: DESCENDING
        filter:
        - column: metric
          function: EQUALS_TO
          args:
          - nv_inference_request_duration_us
        group:
        - columnGroup:
            source: labels
          functions:
          - source: labels
          - source: value
            column: Duration
      columns:
      - id: labels
        expression: value.replaceAll("\"", "").replaceAll("model=", "").replaceAll("version=", "").replaceAll(",", " v")
      filter:
        listening: 'true'
      axis:
        x:
          labels_angle: 15
  - at: {x: 4, y: 5, w: 4, h: 1}
    type: bar-chart
    properties:
      title: Inference Total Duration
      lookup:
        uuid: metrics
        sort:
        - column: value
          sortOrder: DESCENDING
        filter:
        - column: metric
          function: EQUALS_TO
          args:
          - nv_inference_compute_infer_duration_us
        - column: value
          function: GREATER_THAN
          args:
          - 0
        group:
        - columnGroup:
            source: labels
          functions:
          - source: labels
          - source: value
            column: Duration
      columns:
      - id: labels
        expression: value.replaceAll("\"", "").replaceAll("model=", "").replaceAll("version=", "").replaceAll(",", " v")
      filter:
        listening: 'true'
  - at: {x: 8, y: 5, w: 4, h: 1}
    type: bar-chart
    properties:
      title: Queue Wait
      lookup:
        uuid: metrics
        sort:
        - column: value
          sortOrder: DESCENDING
        filter:
        - column: metric
          function: EQUALS_TO
          args:
          - nv_inference_queue_duration_us
        - column: value
          function: GREATER_THAN
          args:
          - 0
        group:
        - columnGroup:
            source: labels
          functions:
          - source: labels
          - source: value
            column: Duration
      columns:
      - id: labels
        expression: value.replaceAll("\"", "").replaceAll("model=", "").replaceAll("version=", "").replaceAll(",", " v")
      filter:
        listening: 'true'
