pages:
- name: index
  components:
  - type: TABS
    properties:
      navGroupId: ClinicalNav
      width: 100%
- name: Ward Overview
  grid:
  - at: {x: 0, y: 0, w: 3, h: 1}
    type: metric
    properties:
      title: Total Patients
      lookup:
        uuid: patients
        group:
        - functions:
          - source: id
            function: COUNT
      columns:
      - id: id
        pattern: '#'
  - at: {x: 3, y: 0, w: 3, h: 1}
    type: metric
    properties:
      title: Critical Count
      lookup:
        uuid: patients
        filter:
        - column: status
          function: EQUALS_TO
          args:
          - Critical
        group:
        - functions:
          - source: id
            function: COUNT
      columns:
      - id: id
        pattern: '#'
  - at: {x: 6, y: 0, w: 3, h: 1}
    type: metric
    properties:
      title: Avg Age
      lookup:
        uuid: patients
        group:
        - functions:
          - source: age
            function: AVERAGE
      columns:
      - id: age
        pattern: '#.#'
  - at: {x: 9, y: 0, w: 3, h: 1}
    type: metric
    properties:
      title: Flagged
      lookup:
        uuid: patients
        filter:
        - column: flagged
          function: EQUALS_TO
          args:
          - 'true'
        group:
        - functions:
          - source: id
            function: COUNT
      columns:
      - id: id
        pattern: '#'
  - at: {x: 0, y: 1, w: 12, h: 1}
    type: selector
    properties:
      lookup:
        uuid: patients
        group:
        - columnGroup:
            source: ward
          functions:
          - source: ward
      filter:
        selfApply: true
        notification: true
  - at: {x: 0, y: 2, w: 4, h: 1}
    type: pie-chart
    properties:
      title: Patients by Diagnosis
      lookup:
        uuid: patients
        group:
        - columnGroup:
            source: diagnosis
          functions:
          - source: diagnosis
          - source: id
            function: COUNT
      filter:
        listening: true
  - at: {x: 4, y: 2, w: 4, h: 1}
    type: bar-chart
    properties:
      title: Patients by Ward
      lookup:
        uuid: patients
        group:
        - columnGroup:
            source: ward
          functions:
          - source: ward
          - source: id
            function: COUNT
      filter:
        listening: true
  - at: {x: 8, y: 2, w: 4, h: 1}
    type: pie-chart
    properties:
      title: Patients by Status
      lookup:
        uuid: patients
        group:
        - columnGroup:
            source: status
          functions:
          - source: status
          - source: id
            function: COUNT
      filter:
        listening: true
  - at: {x: 0, y: 3, w: 8, h: 1}
    type: markdown
    properties:
      content: '## #{filter.ward ? filter.ward + " Ward" : "All Wards"} Overview

        **Current Status:** #{datasets.patients.rowCount} patients

        **ICU Protocols:** - Vitals monitoring every 2 hours - Critical patients require attending physician approval for
        transfers - Family visitation restricted to 15 minutes per hour

        **General Ward:** - Standard vitals monitoring every 4 hours - Discharge planning begins at admission - Medication
        reconciliation required within 24 hours

        **Pediatrics:** - Parent/guardian must remain with patient under 12 - Specialized dosing protocols for all medications
        - Play therapy available 9 AM - 5 PM

        **Maternity:** - Rooming-in encouraged for all mothers - Lactation consultant available on request - Newborn screening
        completed before discharge'
  - at: {x: 8, y: 3, w: 4, h: 1}
    alert:
      severity: warning
      content: Review flagged patients requiring immediate attention
      dismissible: false
  - at: {x: 8, y: 4, w: 4, h: 1}
    type: badge
    properties:
      lookup:
        uuid: patients
        group:
        - columnGroup:
            source: status
          functions:
          - source: status
  - at: {x: 0, y: 5, w: 9, h: 1}
    type: timeline
    properties:
      title: Admission Timelines
      lookup:
        uuid: admissions
      chart:
        zoom: true
        height: 300
  - at: {x: 9, y: 5, w: 3, h: 1}
    type: countdown
    properties:
      title: Next ICU Rounds
      lookup:
        uuid: nextReview
- name: Vitals Monitor
  grid:
  - at: {x: 0, y: 0, w: 12, h: 1}
    type: area-chart
    properties:
      title: Heart Rate by Patient
      lookup:
        uuid: vitals
        group:
        - columnGroup:
            source: patientId
          functions:
          - source: patientId
          - source: heartRate
            function: AVERAGE
      filter:
        listening: true
  - at: {x: 0, y: 1, w: 6, h: 1}
    type: line-chart
    properties:
      title: Blood Pressure
      lookup:
        uuid: vitals
        group:
        - columnGroup:
            source: timestamp
          functions:
          - source: timestamp
          - source: systolic
            function: AVERAGE
          - source: diastolic
            function: AVERAGE
      filter:
        listening: true
  - at: {x: 6, y: 1, w: 6, h: 1}
    type: line-chart
    properties:
      title: Oxygen Saturation
      lookup:
        uuid: vitals
        group:
        - columnGroup:
            source: timestamp
          functions:
          - source: timestamp
          - source: o2Saturation
            function: AVERAGE
      filter:
        listening: true
  - at: {x: 0, y: 2, w: 12, h: 1}
    type: ''
    properties:
      lookup:
        uuid: vitals
      columns:
      - id: temperature
        expression: 'value > 38.5 ? "⚠️ " + value : value'
- name: Patient Detail
  dataScope:
    dataset: patients
    idColumn: id
  save:
    trigger: auto
    delay: 2000
    adapter: local
  components:
  - html: <div class='pf-v5-c-card pf-m-compact'><div class='pf-v5-c-card__title'>Patient Records</div><div class='pf-v5-c-card__body'>
  - displayer:
      table:
        sortable: true
      filter:
        listening: true
        notification: true
      lookup:
        uuid: patients
    visibleWhen: '#{filter.ward}'
  - html: </div></div>
  - action-button:
      label: Admit New Patient
      url: /api/patients
      method: POST
      style: primary
      confirm: Add a new patient to the system?
      body:
        name: New Patient
        status: Stable
      onSuccess:
        message: Patient admitted successfully
      onError:
        message: Failed to admit patient
  - html: <div class='pf-v5-c-card pf-m-compact'><div class='pf-v5-c-card__title'>Edit Patient</div><div class='pf-v5-c-card__body'>
  - text-input:
      field: name
      label: Patient Name
      readonly: true
  - number-input:
      field: age
      label: Age
      readonly: true
  - dropdown:
      field: ward
      label: Ward
      options:
        values:
        - ICU
        - General
        - Pediatrics
        - Maternity
        - Outpatient
  - dropdown:
      field: status
      label: Status
      options:
        values:
        - Stable
        - Monitoring
        - Critical
  - text-input:
      field: doctor
      label: Doctor
  - textarea:
      field: notes
      label: Notes
      rows: 4
  - date-picker:
      field: admitDate
      label: Admit Date
      readonly: true
  - checkbox:
      field: flagged
      label: Flagged for Review
  - html: </div></div>
- name: Assignments
  grid:
  - at: {x: 0, y: 0, w: 12, h: 1}
    type: graph
    properties:
      title: Doctor-Patient Assignments
      lookup:
        uuid: assignments
      chart:
        height: 500
navTree:
  root_items:
  - type: GROUP
    id: ClinicalNav
    children:
    - page: Ward Overview
    - page: Vitals Monitor
    - page: Patient Detail
    - page: Assignments
