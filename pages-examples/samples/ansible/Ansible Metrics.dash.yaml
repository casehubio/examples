properties:
  token: your token here
  authorizationHeader: Basic ${token}
  towerUrl: your tower url here
  proxyUrl: a proxy to make HTTP requests if CORS is not enabled
  subTitlesStyle: 'font-size: large; margin: 15px 0 10px 0'
global:
  displayer:
    lookup:
      uuid: metrics
    columns:
    - id: value
      pattern: '#'
datasets:
- uuid: metrics
  url: data/metrics
  cacheEnabled: true
  refreshTime: 1minute
  columns:
  - id: metric
    type: LABEL
  - id: labels
    type: LABEL
  - id: Value
    type: Number
  headers:
    Authorization: ${authorizationHeader}
    Content-Type: text/plain
    Target-Url: ${towerUrl}/api/v2/metrics/?metrics
pages:
- properties:
    margin-left: 5px
  grid:
  - at: {x: 0, y: 0, w: 12, h: 1}
    type: html
    properties:
      content: "<p>\n  <a href=\"${towerUrl}\" style=\"font-size: xx-large\">Ansible Tower</a>\n  <small>Metrics Summary</small>\n\
        </p> <hr />"
  - at: {x: 0, y: 1, w: 12, h: 1}
    type: html
    properties:
      content: <p style="${subTitlesStyle}">Access</p>
  - at: {x: 0, y: 2, w: 3, h: 1}
    type: metric
    properties:
      title: Active Sessions
      lookup:
        filter:
        - column: metric
          function: EQUALS_TO
          args:
          - awx_sessions_total
        - column: labels
          function: EQUALS_TO
          args:
          - type="all"
        group:
        - functions:
          - source: value
  - at: {x: 3, y: 2, w: 3, h: 1}
    type: metric
    properties:
      title: Users
      lookup:
        filter:
        - column: metric
