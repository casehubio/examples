global:
  mode: dark
  displayer:
    axis:
      x:
        labels_angle: 12
    columns:
    - id: value
      pattern: '#'
    lookup:
      uuid: metrics
    html:
      html: "<div id=\"${this}\" class=\"card-pf card-pf-aggregate-status\" style=\"background-color: ${bgColor}; width: 90%;\
        \ height: 90px;margin: 10px; border-radius: 10px\">\n  <h2 style=\"font-weight: 600; font-size: x-large\" id=\"${this}Value\"\
        >${value} <span id=\"${this}Suffix\" class=\"\"></span></h2>\n  <p style=\"font-weight: 400; font-size: large\" id=\"\
        ${this}Title\"><em id=\"${this}Icon\" class=\"\"></em> ${title}</p>\n</div>"
properties:
  modelMeshMetricsUrl: metrics
  titleFontSize: 40px
datasets:
- uuid: metrics
  url: ${modelMeshMetricsUrl}
  columns:
  - id: metric
    type: LABEL
  - id: labels
    type: LABEL
  - id: value
    type: number
- uuid: request_response_size
  url: ${modelMeshMetricsUrl}
  expression: "(\n    $requestSize := $number($[$[0] = \"modelmesh_request_size_bytes_sum\"][0][2]);\n    $requestCount :=\
    \ $number($[$[0] = \"modelmesh_request_size_bytes_count\"][0][2]);\n    $responseSize := $number($[$[0] = \"modelmesh_response_size_bytes_sum\"\
    ][0][2]);\n    $responseCount := $number($[$[0] = \"modelmesh_response_size_bytes_count\"][0][2]);\n\n    [ \"Size\",\
    \ $requestSize / $requestCount,  $responseSize / $responseCount]\n)"
  columns:
  - id: Metric
    type: LABEL
  - id: Request
    type: number
  - id: Response
    type: number
- uuid: jvm_memory
  url: ${modelMeshMetricsUrl}
  expression: "(\n    $metrics := $[$[0] in [\"jvm_memory_pool_bytes_used\", \"jvm_memory_pool_bytes_committed\"]].[\n   \
    \     {\n                \"metric\": $[0],\n                \"label\": $[1],\n                \"value\": $[2]\n      \
    \      }\n    ];\n    $map($distinct($metrics.label), function($l) {\n        (\n            $used := $metrics[label =\
    \ $l and metric = \"jvm_memory_pool_bytes_used\"].value;\n            $committed := $metrics[label = $l and metric = \"\
    jvm_memory_pool_bytes_committed\"].value;\n            [\n              $l,\n              $used ?  $used : \"-1\",\n\
    \              $committed ?  $committed : -1\n            ] \n      )\n    })\n)"
  columns:
  - id: Pool
    type: LABEL
  - id: Used
    type: number
  - id: Committed
    type: number
pages:
- properties:
    padding: 10px
  grid:
  - at: {x: 0, y: 0, w: 12, h: 1}
    type: html
    properties:
      content: <p>Model Mesh Metrics</p> <hr />
  - at: {x: 0, y: 1, w: 3, h: 1}
    type: metric
    properties:
      title: Managed Models
      lookup:
        filter:
        - column: metric
          function: EQUALS_TO
          args:
          - modelmesh_models_managed_total
        group:
        - functions:
          - source: value
  - at: {x: 3, y: 1, w: 3, h: 1}
    type: metric
    properties:
      title: Models with Failure
      lookup:
        filter:
        - column: metric
          function: EQUALS_TO
          args:
          - modelmesh_models_with_failure_total
        group:
        - functions:
          - source: value
  - at: {x: 6, y: 1, w: 3, h: 1}
    type: metric
    properties:
      title: Load Model (ms)
      lookup:
        filter:
        - column: metric
          function: EQUALS_TO
          args:
          - modelmesh_loadmodel_milliseconds_sum
        group:
        - functions:
          - source: value
  - at: {x: 9, y: 1, w: 3, h: 1}
    type: metric
    properties:
      title: Models Size (kb)
      lookup:
        filter:
        - column: metric
          function: EQUALS_TO
          args:
          - modelmesh_loaded_model_size_bytes_sum
        group:
        - functions:
          - source: value
            column: value_kb
      columns:
      - id: value_kb
        pattern: '#'
        expression: value / 1024
  - at: {x: 0, y: 2, w: 12, h: 1}
    type: html
    properties:
      content: <hr />
  - at: {x: 0, y: 3, w: 12, h: 1}
    type: html
    properties:
      content: '<p style="font-size: 25px; font-weight: 600"> JVM Memory </p>'
  - at: {x: 0, y: 4, w: 12, h: 1}
    type: bar-chart
    properties:
      lookup:
        uuid: jvm_memory
        group:
        - columnGroup:
            source: Pool
          functions:
          - source: Pool
          - source: Used
          - source: Committed
      columns:
      - id: Pool
        expression: value.replace("pool=\"", "").replace("\",", "")
      chart:
        resizable: true
        height: 400
        grid:
          x: false
      extraConfiguration: "{\n    \"color\": [\n    \"#007090\",\n    \"#009040\",\n    \"#e0a000\",\n    \"#a02020\"\n  \
        \  ]\n}"
