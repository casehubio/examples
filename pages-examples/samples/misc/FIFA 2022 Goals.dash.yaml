properties:
  GoalsFunction: AVERAGE
  SeriesColor: cyan
global:
  mode: dark
  displayer:
    extraConfiguration: "{\n    \"color\": \"${SeriesColor}\"\n}"
    axis:
      y:
        title: AVG Goals
    chart:
      resizable: true
      height: 300
      grid:
        y: false
        x: false
    html:
      html: "<div style=\"width: 95%;height: auto;margin-top:0px;margin-right:0px;margin-bottom:0px;margin-left:0px;\"> <div\
        \ class=\"pf-v5-c-card pf-m-compact pf-m-rounded\">    \n        <div class=\"pf-v5-c-card__title\"><div class=\"\
        pf-v5-c-title pf-m-2xl\">${value}</div></div>\n        <div class=\"pf-v5-c-card__footer\">\n            ${title}\n\
        \        </div>    \n</div></div>"
    export:
      png: true
datasets:
- uuid: fifa_matches
  url: https://api.fifa.com/api/v3/calendar/matches?from=2022-11-20T00%3A00%3A00Z&to=2022-12-20T23%3A59%3A59Z&language=en&count=500&idSeason=255711
  cacheEnabled: true
  expression: "$.Results.[\n    ( $.MatchStatus = 0 ? \n          [\n              $.IdMatch,\n              $.LocalDate =\
    \ null ? \"\" : $.LocalDate, \n              $toMillis($.LocalDate) ~>  $fromMillis('[D]-[M]-[Y]'),\n              $toMillis($.LocalDate)\
    \ ~>  $fromMillis('[H]:[m]'),\n              $.Weather.Humidity != null ? $.Weather.Humidity : \"-1\",\n             \
    \ $.Weather.Temperature != null ? $.Weather.Temperature : \"-1\", \n              $.Weather.WindSpeed != null ? $.Weather.WindSpeed\
    \ :  \"-1\",\n              $.Weather.TypeLocalized[0].Description != null ? $.Weather.TypeLocalized[0].Description :\
    \  \"\",\n              $.Home.IdCountry != null ? $.Home.IdCountry : \"\", \n              $.Home.ShortClubName != null\
    \ ? $.Home.ShortClubName : \"\", \n              $.HomeTeamScore != null ? $.HomeTeamScore : \"-1\",\n              $.Away.IdCountry\
    \ != null ? $.Away.IdCountry : \"\", \n              $.Away.ShortClubName != null ? $.Away.ShortClubName : \"\", \n  \
    \            $.Away.Score != null ? $.Away.Score : \"-1\",\n              $.Stadium.Name[0].Description,\n           \
    \   $.Stadium.CityName[0].Description,\n              $.Attendance != null ? $.Attendance :  \"-1\",                 \
    \       \n              $.HomeTeamScore + $.AwayTeamScore,\n              $join([$.Home.ShortClubName, $.Away.ShortClubName],\
    \ ' vs ')\n              \n          ]\n    )\n]"
  columns:
  - id: ID
    type: LABEL
  - id: Date
    type: LABEL
  - id: Day
    type: LABEL
  - id: Hour
    type: LABEL
  - id: Humidity
    type: NUMBER
  - id: Temperature
    type: NUMBER
  - id: WindSpeed
    type: NUMBER
  - id: Weather
    type: LABEL
  - id: Team 1 Country
    type: LABEL
  - id: Team 1 Name
    type: LABEL
  - id: Team 1 Score
    type: NUMBER
  - id: Team 2 Country
    type: LABEL
  - id: Team 2 Name
    type: LABEL
  - id: Team 2 Score
    type: NUMBER
  - id: Stadium Name
    type: LABEL
  - id: Stadium Location Name
    type: LABEL
  - id: Attendance
    type: NUMBER
  - id: Total Goals
    type: NUMBER
  - id: Match Name
    type: LABEL
pages:
- grid:
  - at: {x: 0, y: 0, w: 12, h: 1}
    type: html
    properties:
      content: "<p>\n    <p style=\"font-size: xx-large\">\n    FIFA World Cup Qatar 2022™\n    </p>\n    <small>\n      \
        \  Goals Score Statistics\n    </small>\n    <hr />\n</p>"
  - at: {x: 0, y: 1, w: 3, h: 1}
    type: metric
    properties:
      title: Total Goals
      lookup:
        uuid: fifa_matches
        group:
        - functions:
          - source: Total Goals
            function: SUM
      columns:
      - id: Total Goals
        pattern: '#'
  - at: {x: 3, y: 1, w: 3, h: 1}
    type: metric
    properties:
      title: Average Goals by Match
      lookup:
        uuid: fifa_matches
        group:
        - functions:
          - source: Total Goals
            function: AVERAGE
  - at: {x: 6, y: 1, w: 3, h: 1}
    type: metric
    properties:
      title: Average Temperature
      lookup:
        uuid: fifa_matches
        group:
        - functions:
          - source: Temperature
            function: AVERAGE
  - at: {x: 9, y: 1, w: 3, h: 1}
    type: metric
    properties:
      title: Average Attendance
      lookup:
        uuid: fifa_matches
        group:
        - functions:
          - source: Attendance
            function: AVERAGE
  - at: {x: 0, y: 2, w: 6, h: 1}
    type: line-chart
    properties:
      title: Goals by Day
      lookup:
        uuid: fifa_matches
        group:
        - columnGroup:
            source: Day
          functions:
          - source: Day
          - source: Total Goals
            column: Goals
            function: ${GoalsFunction}
      axis:
        x:
          labels_angle: 30
  - at: {x: 6, y: 2, w: 6, h: 1}
    type: bar-chart
    properties:
      title: Goals by Stadium
      lookup:
        uuid: fifa_matches
        sort:
        - column: Goals
          order: DESCENDING
        group:
        - columnGroup:
            source: Stadium Name
          functions:
          - source: Stadium Name
          - source: Total Goals
            function: ${GoalsFunction}
            column: Goals
      axis:
        x:
          labels_angle: 15
  - at: {x: 0, y: 3, w: 6, h: 1}
    type: bubblechart
    properties:
      title: Goals by Weather
      subtitle: Bubble shows total matches
      lookup:
        uuid: fifa_matches
        sort:
        - column: TOTAL MATCHES
          order: ASCENDING
        group:
        - columnGroup:
            source: Weather
          functions:
          - source: Weather
          - source: Total Goals
            function: ${GoalsFunction}
            column: Goals
          - source: Weather
            function: COUNT
            column: TOTAL MATCHES
          - source: Weather
            function: COUNT
            column: TOTAL MATCHES
  - at: {x: 6, y: 3, w: 6, h: 1}
    type: bubblechart
    properties:
      title: Goals by Attendance
      subtitle: Bubble shows total goals
      lookup:
        uuid: fifa_matches
        group:
        - columnGroup:
            source: Match Name
          functions:
          - source: Match Name
          - source: Attendance
            column: Attendance
          - source: Total Goals
            column: Goals
          - source: Total Goals
            column: Goals
      chart:
        zoom: true
      axis:
        x:
          labels_show: false
        y:
          title: Attendance
  - at: {x: 0, y: 4, w: 12, h: 1}
    type: html
    properties:
      content: "<hr style=\"width: 2px; border: dashed 1px\" /> <p style=\"margin: 1px 10px 30px 10px; font-size: x-large\"\
        >\n\n    <strong>All Matches</strong>\n</p>"
  - at: {x: 0, y: 5, w: 12, h: 1}
    type: ''
    properties:
      lookup:
        uuid: fifa_matches
        group:
        - functions:
          - source: Temperature
          - source: ID
          - source: Date
          - source: Team 1 Score
          - source: Match Name
          - source: Team 2 Score
          - source: Weather
          - source: Stadium Name
          - source: Attendance
      columns:
      - id: Date
        expression: new Date(value).toLocaleDateString() + " " + new Date(value).toLocaleTimeString()
      - id: Team 1 Score
        pattern: '#'
      - id: Team 2 Score
        pattern: '#'
      chart:
        resizable: true
