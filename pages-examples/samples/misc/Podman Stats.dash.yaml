properties:
  baseUrl: /data/podman
global:
  displayer:
    chart:
      resizable: true
    table:
      sort:
        enabled: true
datasets:
- uuid: images
  expression: $.[Id, Names[0], $fromMillis(Created * 1000), $round(Size / 1000000), Containers]
  url: ${baseUrl}/images/json
  columns:
  - id: ID
    type: label
  - id: name
    type: label
  - id: created
    type: date
  - id: Size (MB)
    type: number
  - id: containers
    type: number
- uuid: containers
  expression: $.[Id, Names[0], Image, $fromMillis(Created * 1000), State, Status]
  url: ${baseUrl}/containers/json
  columns:
  - id: ID
    type: label
  - id: name
    type: label
  - id: image
    type: label
  - id: created
    type: date
  - id: State
    type: label
  - id: Status
    type: label
pages:
- name: Images
  grid:
  - at: {x: 0, y: 0, w: 6, h: 1}
    type: markdown
    properties:
      content: '**Images by Size**'
  - at: {x: 0, y: 1, w: 6, h: 1}
    type: bar-chart
    properties:
      lookup:
        uuid: images
        rowCount: 7
        group:
        - columnGroup:
            source: name
          functions:
          - source: name
          - source: Size (MB)
            column: Total Size (MB)
        sortOps:
        - column: Total Size (MB)
          sortOrder: DESCENDING
      chart:
        height: '350'
        margin:
          left: '120'
      extraConfiguration: "\"series\": {\n  \"label\": {\n      \"position\": \"top\"\n  }\n}\n"
  - at: {x: 6, y: 0, w: 6, h: 1}
    type: markdown
    properties:
      content: '**Containers by Image**'
  - at: {x: 6, y: 1, w: 6, h: 1}
    type: bar-chart
    properties:
      lookup:
        uuid: images
        rowCount: 7
        group:
        - columnGroup:
            source: name
          functions:
          - source: name
          - source: containers
            column: containers total
        sort:
        - column: containers total
          sortOrder: DESCENDING
        filter:
        - column: containers
          function: GREATER_THAN
          args:
          - 0
      columns:
      - id: containers total
        pattern: '#'
      chart:
        width: '500'
        height: '350'
        margin:
          left: '120'
  - at: {x: 0, y: 2, w: 12, h: 1}
    type: markdown
    properties:
      content: '**Images List**'
  - at: {x: 0, y: 3, w: 12, h: 1}
    type: ''
    properties:
      lookup:
        uuid: images
- name: Containers
  grid:
  - at: {x: 0, y: 1, w: 12, h: 1}
    type: markdown
    properties:
      content: '**Filters**'
  - at: {x: 0, y: 2, w: 2, h: 1}
    type: selector
    properties:
      lookup:
        uuid: containers
        groupOps:
        - columnGroup:
            source: image
          functions:
          - source: image
            column: image
      filter:
        notification: 'true'
  - at: {x: 2, y: 2, w: 2, h: 1}
    type: selector
    properties:
      lookup:
        uuid: containers
        groupOps:
        - columnGroup:
            source: state
          functions:
          - source: state
            column: state
      filter:
        notification: true
  - at: {x: 0, y: 3, w: 5, h: 1}
    type: html
    properties:
      content: <strong>Containers by State</strong>
  - at: {x: 0, y: 4, w: 5, h: 1}
    type: bar-chart
    properties:
      lookup:
        uuid: containers
        rowCount: 7
        group:
        - columnGroup:
            source: state
          functions:
          - source: state
          - source: state
            function: COUNT
            column: total
      columns:
      - id: total
        pattern: '#'
      chart:
        width: '500'
        height: '350'
        margin:
          left: '70'
      filter:
        listening: true
  - at: {x: 5, y: 3, w: 6, h: 1}
    type: markdown
    properties:
      content: '**Containers by Image**'
  - at: {x: 5, y: 4, w: 6, h: 1}
    type: bar-chart
    properties:
      lookup:
        uuid: containers
        rowCount: 7
        group:
        - columnGroup:
            source: image
          functions:
          - source: image
          - source: image
            function: Count
            column: Total
        sort:
        - column: Total
          sortOrder: DESCENDING
      chart:
        width: '500'
        height: '350'
        margin:
          left: '120'
      filter:
        listening: true
  - at: {x: 0, y: 5, w: 12, h: 1}
    title: Containers List
    properties:
      size: xl
  - at: {x: 0, y: 6, w: 12, h: 1}
    type: ''
    properties:
      lookup:
        uuid: containers
- name: index
  grid:
  - at: {x: 0, y: 0, w: 12, h: 1}
    type: html
    properties:
      content: '<h1><strong>Podman Dashboard</strong></h1> <p> This is a dashboard to provide basic information about Podman</p>
        <p> It uses <a href="https://docs.podman.io/en/latest/_static/api.html">Podman REST API</a>,   so make sure podman
        service is running on localhost on port 8000 with CORS enabled</p> <p> The following command starts the podman service:
        </p> <p><em>podman system service tcp:localhost:8000 --cors https://jesuino.github.io  -t 0 </em></strong></p>'
  - at: {x: 0, y: 1, w: 12, h: 1}
    type: tabs
    properties:
      targetDivId: podman_tabs_div
      navGroupId: podman_nav_group
  - at: {x: 0, y: 2, w: 12, h: 1}
    type: div
    properties:
      width: 100%
      divId: podman_tabs_div
navTree:
  root_items:
  - id: podman_nav_group
    type: GROUP
    name: Podman Dashboard
    children:
    - page: Containers
    - page: Images
