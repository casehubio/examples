global:
  displayer:
    chart:
      resizable: true
pages:
- name: index
  properties:
    margin: 10px
  components:
  - type: TABS
    properties:
      width: 100%
      navGroupId: ChartsNav
      targetDivId: charts_div
  - div: charts_div
- name: Bar Chart
  grid:
  - at: {x: 0, y: 0, w: 6, h: 1}
    type: bar-chart
    properties:
      title: subtype COLUMN (default)
      lookup:
        uuid: products
        group:
        - columnGroup:
            source: Product
          functions:
          - source: Product
          - source: Quantity
          - source: Quantity2
  - at: {x: 6, y: 0, w: 6, h: 1}
    type: bar-chart
    properties:
      title: subtype BAR
      lookup:
        uuid: products
        group:
        - columnGroup:
            source: Product
          functions:
          - source: Product
          - source: Quantity
          - source: Quantity2
      chart:
        margin:
          left: 80
  - at: {x: 0, y: 1, w: 6, h: 1}
    type: bar-chart
    properties:
      title: subtype COLUMN_STACKED
      lookup:
        uuid: products
        group:
        - columnGroup:
            source: Product
          functions:
          - source: Product
          - source: Quantity
          - source: Quantity2
  - at: {x: 6, y: 1, w: 6, h: 1}
    type: bar-chart
    properties:
      title: subtype BAR_STACKED
      lookup:
        uuid: products
        group:
        - columnGroup:
            source: Product
          functions:
          - source: Product
          - source: Quantity
          - source: Quantity2
      chart:
        margin:
          left: 80
- name: Line Chart
  grid:
  - at: {x: 0, y: 0, w: 6, h: 1}
    type: line-chart
    properties:
      title: subtype LINE (default)
      lookup:
        uuid: products
        group:
        - columnGroup:
            source: Product
          functions:
          - source: Product
          - source: Quantity
          - source: Quantity2
  - at: {x: 6, y: 0, w: 6, h: 1}
    type: line-chart
    properties:
      title: subtype SMOOTH
      lookup:
        uuid: products
        group:
        - columnGroup:
            source: Product
          functions:
          - source: Product
          - source: Quantity
          - source: Quantity2
- name: Area Chart
  grid:
  - at: {x: 0, y: 0, w: 6, h: 1}
    type: area-chart
    properties:
      title: subtype AREA (default)
      lookup:
        uuid: products
        group:
        - columnGroup:
            source: Product
          functions:
          - source: Product
          - source: Quantity
          - source: Quantity2
  - at: {x: 6, y: 0, w: 6, h: 1}
    type: area-chart
    properties:
      title: subtype AREA_STACKED
      lookup:
        uuid: products
        group:
        - columnGroup:
            source: Product
          functions:
          - source: Product
          - source: Quantity
          - source: Quantity2
- name: Pie Chart
  grid:
  - at: {x: 0, y: 0, w: 6, h: 1}
    type: pie-chart
    properties:
      title: subtype PIE (default)
      lookup:
        uuid: products
        group:
        - columnGroup:
            source: Product
          functions:
          - source: Product
          - source: Quantity
  - at: {x: 6, y: 0, w: 6, h: 1}
    type: pie-chart
    properties:
      title: subtype DONUT
      lookup:
        uuid: products
        group:
        - columnGroup:
            source: Product
          functions:
          - source: Product
          - source: Quantity
- name: Bubble Chart
  components:
  - displayer:
      type: BUBBLECHART
      general:
        title: Bubble Chart
      lookup:
        uuid: products
        group:
        - columnGroup:
            source: Product
          functions:
          - source: Product
          - source: Quantity
          - source: Quantity2
          - source: Product
- name: Timeseries
  components:
  - displayer:
      type: TIMESERIES
      general:
        title: Timeseries
      chart:
        zoom: true
      external:
        width: 100%
      lookup:
        uuid: timeseries
navTree:
  root_items:
  - type: GROUP
    id: ChartsNav
    children:
    - page: Bar Chart
    - page: Line Chart
    - page: Area Chart
    - page: Pie Chart
    - page: Bubble Chart
    - page: Timeseries
datasets:
- uuid: products
  content: "[\n  [\"Computers\", \"Scanner\", 5, 3],\n  [\"Computers\", \"Printer\", 7, 4],\n  [\"Computers\", \"Laptop\"\
    , 3, 2],\n  [\"Electronics\", \"Camera\", 10, 7],\n  [\"Electronics\", \"Headphones\", 5, 9]\n]"
  columns:
  - id: Section
    type: LABEL
  - id: Product
    type: LABEL
  - id: Quantity
    type: NUMBER
  - id: Quantity2
    type: NUMBER
- uuid: timeseries
  content: "[\n  [\"2024-01-01\", 120, 80],\n  [\"2024-02-01\", 135, 95],\n  [\"2024-03-01\", 150, 110],\n  [\"2024-04-01\"\
    , 140, 105],\n  [\"2024-05-01\", 165, 120],\n  [\"2024-06-01\", 180, 130],\n  [\"2024-07-01\", 175, 125],\n  [\"2024-08-01\"\
    , 190, 140],\n  [\"2024-09-01\", 200, 155],\n  [\"2024-10-01\", 210, 160],\n  [\"2024-11-01\", 195, 150],\n  [\"2024-12-01\"\
    , 220, 170]\n]"
  columns:
  - id: Date
    type: DATE
  - id: Series A
    type: NUMBER
  - id: Series B
    type: NUMBER
