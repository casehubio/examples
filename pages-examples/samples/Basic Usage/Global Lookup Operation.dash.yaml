global:
  dataset:
    uuid: global
    content: "[\n    [\"A\", 3],\n    [\"B\", 2],\n    [\"C\", 1],\n    [\"D\", 0],\n    [\"E\", -1],\n    [\"F\", -2],\n\
      \    [\"G\", -3],\n]"
  displayer:
    chart:
      resizable: true
    lookup:
      uuid: global
      rowCount: 3
      filter:
      - column: Column 1
        function: GREATER_THAN
        args:
        - -3
      - column: Column 1
        function: LOWER_THAN
        args:
        - 3
      sort:
      - column: Column 0
        order: DESCENDING
pages:
- grid:
  - at: {x: 0, y: 0, w: 12, h: 1}
    type: unknown
  - at: {x: 0, y: 1, w: 4, h: 1}
    type: line-chart
    properties:
      title: Global Lookup with all rows
      lookup:
        rowCount: 10
  - at: {x: 4, y: 1, w: 4, h: 1}
    type: bar-chart
    properties:
      title: Values > 0
      lookup:
        filter:
        - column: Column 1
          function: GREATER_THAN
          args:
          - 0
  - at: {x: 8, y: 1, w: 4, h: 1}
    type: bar-chart
    properties:
      title: Values < 0
      lookup:
        filter:
        - column: Column 1
          function: LOWER_THAN
          args:
          - 0
