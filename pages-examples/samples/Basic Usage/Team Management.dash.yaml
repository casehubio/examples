pages:
- name: Overview
  grid:
  - at: {x: 0, y: 0, w: 12, h: 1}
    type: html
    properties:
      content: "<div style=\"padding: 12px 20px; background: linear-gradient(135deg, #1e3a8a, #1e40af); color: #e0e0e0; margin-bottom:\
        \ 16px; border-radius: 8px\">\n  <strong style=\"font-size: 1.3em\">Team Management</strong>\n  <span style=\"margin-left:\
        \ 12px; opacity: 0.7\">Organization overview and team details</span>\n</div>"
  - at: {x: 0, y: 1, w: 12, h: 1}
    type: ''
    properties:
      title: Teams Overview
      lookup:
        uuid: team_members
        group:
        - columnGroup:
            source: Team
          functions:
          - source: Team
          - source: Member
            function: JOIN
            column: Members
            separator: ', '
          - source: Member
            function: COUNT
            column: Member Count
- name: Team Detail
  components:
  - page: Team Detail
    src: includes/team-detail.dash.yml
- name: Admin Settings
  components:
  - page: Admin Settings
    src: includes/admin-settings.dash.yml
    access:
      roles:
      - admin
