pages:
- name: Reports Detail
  grid:
  - at: {x: 0, y: 0, w: 12, h: 1}
    type: html
    properties:
      content: "<div style=\"padding: 4px 0 12px; color: #6b7280; font-size: 12px\">\n  ↳ Loaded from <code>reports.dash.yml</code>\n\
        </div>"
  - at: {x: 0, y: 1, w: 4, h: 1}
    type: metric
    properties:
      title: Reports Generated
      lookup:
        uuid: report-stats
        filter:
        - column: Metric
          function: EQUALS_TO
          args:
          - Generated
        group:
        - functions:
          - source: Count
            function: SUM
      columns:
      - id: Count
        pattern: '#,##0'
  - at: {x: 4, y: 1, w: 4, h: 1}
    type: metric
    properties:
      title: Avg Generation Time
      lookup:
        uuid: report-stats
        filter:
        - column: Metric
          function: EQUALS_TO
          args:
          - AvgTime
        group:
        - functions:
          - source: Count
            function: SUM
      columns:
      - id: Count
        pattern: '#,##0 ms'
  - at: {x: 8, y: 1, w: 4, h: 1}
    type: metric
    properties:
      title: Failed Reports
      lookup:
        uuid: report-stats
        filter:
        - column: Metric
          function: EQUALS_TO
          args:
          - Failed
        group:
        - functions:
          - source: Count
            function: SUM
      columns:
      - id: Count
        pattern: '#,##0'
  - at: {x: 0, y: 2, w: 12, h: 1}
    type: ''
    properties:
      title: Recent Report Runs
      lookup:
        uuid: report-runs
