pages:
- name: Admin Settings
  grid:
  - at: {x: 0, y: 0, w: 12, h: 1}
    type: html
    properties:
      content: "<div style=\"padding: 4px 0 12px; color: #6b7280; font-size: 12px\">\n  ↳ Loaded from <code>admin-settings.dash.yml</code>\
        \ — Admin access required\n</div>"
  - at: {x: 0, y: 1, w: 4, h: 1}
    type: metric
    properties:
      title: Total Teams
      lookup:
        uuid: team_members
        group:
        - functions:
          - source: Team
            function: COUNT
            column: Count
      columns:
      - id: Count
        pattern: '#,##0'
  - at: {x: 4, y: 1, w: 4, h: 1}
    type: metric
    properties:
      title: Total Members
      lookup:
        uuid: team_members
        group:
        - functions:
          - source: Member
            function: COUNT
            column: Count
      columns:
      - id: Count
        pattern: '#,##0'
  - at: {x: 8, y: 1, w: 4, h: 1}
    type: metric
    properties:
      title: Departments
      lookup:
        uuid: team_members
        group:
        - functions:
          - source: Department
            function: COUNT
            column: Count
      columns:
      - id: Count
        pattern: '#,##0'
