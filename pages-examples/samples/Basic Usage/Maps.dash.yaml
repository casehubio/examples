global:
  displayer:
    chart:
      resizable: true
pages:
- grid:
  - at: {x: 0, y: 0, w: 6, h: 1}
    type: html
    properties:
      content: <h4><strong>subtype MAP_REGIONS (default)</strong></h4><br />
  - at: {x: 0, y: 1, w: 6, h: 1}
    type: map
    properties:
      lookup:
        uuid: countries
        group:
        - columnGroup:
            source: Country
          functions:
          - source: Country
          - source: Value
  - at: {x: 6, y: 0, w: 6, h: 1}
    type: html
    properties:
      content: <h4><strong>subtype MAP_MARKERS</strong></h4><br />
  - at: {x: 6, y: 1, w: 6, h: 1}
    type: map
    properties:
      lookup:
        uuid: countries
        group:
        - columnGroup:
            source: Country
          functions:
          - source: Country
          - source: Value
datasets:
- uuid: countries
  content: "[\n  [\"Brazil\", 6],\n  [\"USA\", 3],\n  [\"China\", 5],\n  [\"India\", 5],\n  [\"Russia\", 6],\n  [\"Canada\"\
    , 6],\n  [\"Australia\", 9],\n  [\"Mali\", 4],\n  [\"South Africa\", 11]\n]"
  columns:
  - id: Country
    type: LABEL
  - id: Value
    type: NUMBER
