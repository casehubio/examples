global:
  displayer:
    chart:
      resizable: true
    lookup:
      uuid: a
datasets:
- uuid: a
  content: |-
    [
        ["A", 1],
        ["B", 2],
        ["C", 3],
    ]            
pages:
- grid:
  - at: {x: 0, y: 0, w: 6, h: 1}
    type: bar-chart
    properties:
      chart:
        height: 300
  - at: {x: 0, y: 1, w: 12, h: 1}
    type: html
    properties:
      content: ROW 2
